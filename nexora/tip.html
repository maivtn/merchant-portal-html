<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tip & Review - Nexora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .payment-btn { transition: all 0.2s ease; }
    .payment-btn.selected { outline: 3px solid #10b981; outline-offset: 2px; transform: scale(1.08); }
    .payment-btn:hover { transform: scale(1.05); }
    .quick-amount-btn { transition: all 0.15s ease; }
    .quick-amount-btn.selected { background-color: #10b981; color: white; border-color: #10b981; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-50 via-white to-teal-50">

  <!-- Header -->
  <div class="bg-white border-b border-gray-100 sticky top-0 z-10 shadow-sm">
    <div class="max-w-md mx-auto px-4 py-2.5 flex items-center justify-between">
      <img src="images/logo-light-mode.png" alt="Nexora" class="h-6 object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'"/>
      <span style="display:none" class="text-lg font-bold text-emerald-600">Nexora</span>
      <span class="text-sm text-gray-900 font-medium">Tip &amp; Review</span>
    </div>
  </div>

  <div class="max-w-md mx-auto px-3 py-3 space-y-3">

    <!-- Staff Card -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 px-3 py-2.5 flex items-center gap-3">
      <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-violet-400 to-purple-600 flex items-center justify-center text-white text-base font-bold shadow-sm select-none shrink-0">
        M
      </div>
      <div class="flex-1 min-w-0">
        <h2 class="text-sm font-bold text-gray-800 leading-tight">Mary S.</h2>
        <p class="text-xs text-gray-400">Nail Technician</p>
      </div>
      <span class="inline-flex items-center gap-1 bg-emerald-50 text-emerald-700 text-xs font-semibold px-2 py-0.5 rounded-full shrink-0">
        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
        4.9
      </span>
    </div>

    <!-- Amount Section -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3">
      <!-- Quick amounts -->
      <div class="grid grid-cols-4 gap-1.5 mb-2.5">
        <button onclick="selectAmount(5)"  class="quick-amount-btn border-2 border-gray-200 rounded-lg py-1.5 text-sm font-semibold text-gray-700">$5</button>
        <button onclick="selectAmount(10)" class="quick-amount-btn border-2 border-gray-200 rounded-lg py-1.5 text-sm font-semibold text-gray-700">$10</button>
        <button onclick="selectAmount(15)" class="quick-amount-btn border-2 border-gray-200 rounded-lg py-1.5 text-sm font-semibold text-gray-700">$15</button>
        <button onclick="selectAmount(20)" class="quick-amount-btn border-2 border-gray-200 rounded-lg py-1.5 text-sm font-semibold text-gray-700">$20</button>
      </div>
      <!-- Custom amount input -->
      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xl font-bold text-gray-400">$</span>
        <input
          id="amountInput"
          type="number" min="0" step="0.01" placeholder="0.00"
          oninput="clearQuickAmount()"
          class="w-full pl-8 pr-3 py-2.5 text-2xl font-bold text-gray-800 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-emerald-400 placeholder-gray-200 text-center"
        />
      </div>
    </div>

    <!-- Payment Methods -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3">
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Phương thức thanh toán</p>
      <div class="grid grid-cols-3 gap-2">
        <button onclick="selectPayment('zelle')"    id="pay-zelle"    class="payment-btn flex flex-col items-center gap-1 p-1.5 rounded-lg border-2 border-gray-100">
          <img src="../atm-qr/icons/zelle.png"    alt="Zelle"      class="w-12 h-12 rounded-full object-cover shadow-sm" />
          <span class="text-xs font-medium text-gray-600">Zelle</span>
        </button>
        <button onclick="selectPayment('venmo')"    id="pay-venmo"    class="payment-btn flex flex-col items-center gap-1 p-1.5 rounded-lg border-2 border-gray-100">
          <img src="../atm-qr/icons/venmo.png"    alt="Venmo"      class="w-12 h-12 rounded-full object-cover shadow-sm" />
          <span class="text-xs font-medium text-gray-600">Venmo</span>
        </button>
        <button onclick="selectPayment('cashapp')"  id="pay-cashapp"  class="payment-btn flex flex-col items-center gap-1 p-1.5 rounded-lg border-2 border-gray-100">
          <img src="../atm-qr/icons/cash_app.png" alt="Cash App"   class="w-12 h-12 rounded-full object-cover shadow-sm" />
          <span class="text-xs font-medium text-gray-600">Cash</span>
        </button>
        <button onclick="selectPayment('apple')"    id="pay-apple"    class="payment-btn flex flex-col items-center gap-1 p-1.5 rounded-lg border-2 border-gray-100">
          <img src="../atm-qr/icons/apple_cash.png" alt="Apple Cash" class="w-12 h-12 rounded-full object-cover shadow-sm" />
          <span class="text-xs font-medium text-gray-600">Apple</span>
        </button>
        <button onclick="selectPayment('paypal')"   id="pay-paypal"   class="payment-btn flex flex-col items-center gap-1 p-1.5 rounded-lg border-2 border-gray-100">
          <img src="../atm-qr/icons/paypal.png"   alt="PayPal"     class="w-12 h-12 rounded-full object-cover shadow-sm" />
          <span class="text-xs font-medium text-gray-600">PayPal</span>
        </button>
        <button onclick="selectPayment('vlinkpay')" id="pay-vlinkpay" class="payment-btn flex flex-col items-center gap-1 p-1.5 rounded-lg border-2 border-gray-100">
          <img src="../atm-qr/icons/vlinkpay.png" alt="VLinkPay"   class="w-12 h-12 rounded-full object-cover shadow-sm" />
          <span class="text-xs font-medium text-gray-600">VLink</span>
        </button>
      </div>
    </div>

    <!-- Account Info — standard -->
    <div id="accountInfo" class="hidden bg-emerald-50 rounded-xl border border-emerald-200 px-3 py-2.5">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2 min-w-0">
          <span id="paymentBadge" class="text-xs font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full shrink-0"></span>
          <span class="text-xs text-gray-500" id="accountLabel"></span>
          <span class="text-sm font-semibold text-gray-800 truncate" id="accountValue"></span>
        </div>
        <button onclick="copyAccount()" class="text-xs font-semibold text-emerald-600 bg-white border border-emerald-200 px-2.5 py-1 rounded-lg hover:bg-emerald-50 transition shrink-0 ml-2">
          Sao chép
        </button>
      </div>
      <p id="copySuccess" class="hidden mt-1 text-xs text-emerald-600 font-medium">✓ Đã sao chép</p>
    </div>

    <!-- Account Info — VLinkPay -->
    <div id="vlinkpayInfo" class="hidden bg-emerald-50 rounded-xl border border-emerald-200 p-3">
      <div class="flex items-center justify-between mb-2">
        <p class="text-xs font-semibold text-emerald-700 uppercase tracking-wider">Tài khoản VLinkPay</p>
        <span class="text-xs font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full">VLinkPay</span>
      </div>
      <div class="flex gap-3 items-center">
        <div class="shrink-0 bg-white rounded-lg p-1.5 shadow-sm border border-emerald-100">
          <img id="vlinkQrImg" src="" alt="QR" class="w-20 h-20 rounded" />
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-xs text-gray-400 mb-1">Địa chỉ ví</p>
          <p id="vlinkWallet" class="text-xs font-mono font-semibold text-gray-800 break-all leading-relaxed"></p>
          <button onclick="copyVlinkWallet()" class="mt-2 w-full text-xs font-semibold text-emerald-600 bg-white border border-emerald-200 px-2.5 py-1.5 rounded-lg hover:bg-emerald-50 transition flex items-center justify-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
            Sao chép địa chỉ ví
          </button>
        </div>
      </div>
      <p id="vlinkCopySuccess" class="hidden mt-1.5 text-xs text-emerald-600 font-medium text-center">✓ Đã sao chép địa chỉ ví</p>
    </div>

    <!-- Step-by-step instructions -->
    <div id="stepGuide" class="hidden bg-blue-50 border border-blue-100 rounded-lg px-3 py-2 text-xs text-gray-600">
      <span id="step1Text">Copy tài khoản</span> <span class="text-blue-300">·</span> <span id="step2Text">Mở Zelle</span> &amp; chuyển <span id="step3Text" class="font-semibold text-gray-800">$0.00</span> <span class="text-blue-300">·</span> (3) Sau đó nhấn xác nhận bên dưới
    </div>

    <!-- Send Button -->
    <button
      id="sendBtn"
      onclick="sendTip()"
      class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-500 text-white text-base font-bold rounded-xl shadow-lg shadow-emerald-200 hover:from-emerald-600 hover:to-teal-600 active:scale-95 transition-all duration-200 flex items-center justify-center gap-2"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
      <span id="sendBtnText">Tôi đã gửi tip qua Zelle rồi</span>
    </button>
  </div>

  <script>
    const paymentAccounts = {
      zelle:    { label: 'Email', value: 'test@example.usvaq',    badge: 'Zelle',      app: 'Zelle',      copyStep: 'Copy email Zelle' },
      venmo:    { label: '@',     value: '@marys-nail',            badge: 'Venmo',      app: 'Venmo',      copyStep: 'Copy tên Venmo' },
      cashapp:  { label: 'Tag',   value: '$marynails',             badge: 'Cash App',   app: 'Cash App',   copyStep: 'Copy Cash Tag' },
      apple:    { label: 'Phone', value: '(555) 123-4567',         badge: 'Apple Cash', app: 'Apple Cash', copyStep: 'Copy số điện thoại' },
      paypal:   { label: 'Email', value: 'mary@nailstudio.com',    badge: 'PayPal',     app: 'PayPal',     copyStep: 'Copy email PayPal' },
      vlinkpay: { wallet: 'VLK:0x3f9A8b2C1d4E5f6A7B8C9D0E1F2A3B4C5D6E7F8', badge: 'VLinkPay', app: 'VLinkPay', copyStep: 'Quét QR hoặc copy địa chỉ ví' },
    };

    const VLINK_WALLET = 'VLK:0x3f9A8b2C1d4E5f6A7B8C9D0E1F2A3B4C5D6E7F8';
    const STAFF_NAME   = 'Mary S.';

    let selectedPayment = null;

    function updateSteps(method) {
      const acc    = paymentAccounts[method];
      const amount = parseFloat(document.getElementById('amountInput').value) || 0;
      const amtStr = amount > 0 ? `$${amount.toFixed(2)}` : '?';

      document.getElementById('step1Text').textContent = `(1)) ${acc.copyStep}` ;
      document.getElementById('step2Text').textContent = `(2) Mở ${acc.app}`;
      document.getElementById('step3Text').textContent = amtStr;
      document.getElementById('sendBtnText').textContent = `Tôi đã gửi tip qua ${acc.badge} rồi`;
      document.getElementById('stepGuide').classList.remove('hidden');
    }

    function selectPayment(method) {
      document.querySelectorAll('.payment-btn').forEach(b => b.classList.remove('selected'));
      document.getElementById('pay-' + method).classList.add('selected');
      selectedPayment = method;

      if (method === 'vlinkpay') {
        document.getElementById('accountInfo').classList.add('hidden');
        document.getElementById('vlinkpayInfo').classList.remove('hidden');
        document.getElementById('vlinkWallet').textContent = VLINK_WALLET;
        document.getElementById('vlinkQrImg').src =
          'https://api.qrserver.com/v1/create-qr-code/?size=160x160&margin=4&data=' + encodeURIComponent(VLINK_WALLET);
        document.getElementById('vlinkCopySuccess').classList.add('hidden');
      } else {
        document.getElementById('vlinkpayInfo').classList.add('hidden');
        document.getElementById('accountInfo').classList.remove('hidden');
        const acc = paymentAccounts[method];
        document.getElementById('accountLabel').textContent = acc.label + ':';
        document.getElementById('accountValue').textContent = acc.value;
        document.getElementById('paymentBadge').textContent = acc.badge;
        document.getElementById('copySuccess').classList.add('hidden');
      }
      updateSteps(method);
    }

    function copyAccount() {
      if (!selectedPayment || selectedPayment === 'vlinkpay') return;
      navigator.clipboard.writeText(paymentAccounts[selectedPayment].value).then(() => {
        const el = document.getElementById('copySuccess');
        el.classList.remove('hidden');
        setTimeout(() => el.classList.add('hidden'), 2000);
      });
    }

    function copyVlinkWallet() {
      navigator.clipboard.writeText(VLINK_WALLET).then(() => {
        const el = document.getElementById('vlinkCopySuccess');
        el.classList.remove('hidden');
        setTimeout(() => el.classList.add('hidden'), 2000);
      });
    }

    function selectAmount(val) {
      document.querySelectorAll('.quick-amount-btn').forEach(b => b.classList.remove('selected'));
      event.currentTarget.classList.add('selected');
      document.getElementById('amountInput').value = val;
      if (selectedPayment) updateSteps(selectedPayment);
    }

    function clearQuickAmount() {
      document.querySelectorAll('.quick-amount-btn').forEach(b => b.classList.remove('selected'));
      if (selectedPayment) updateSteps(selectedPayment);
    }

    function sendTip() {
      const amount = parseFloat(document.getElementById('amountInput').value);
      if (!amount || amount <= 0) { alert('Vui lòng nhập số tiền tip'); return; }
      if (!selectedPayment)       { alert('Vui lòng chọn phương thức thanh toán'); return; }
      const params = new URLSearchParams({
        amount: amount.toFixed(2),
        via: selectedPayment,
        staff: 'Mary S.',
        role: 'Nail Technician',
        initial: 'M',
      });
      window.location.href = 'review.html?' + params.toString();
    }
  </script>
</body>
</html>
