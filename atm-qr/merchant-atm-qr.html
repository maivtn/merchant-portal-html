<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Merchant ATM QR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="merchant-atm-common.css" />
  <script defer src="merchant-atm-common.js"></script>
</head>

<body class="antialiased">
  <main class="screen-shell">
    <section class="phone-frame">
      <div class="merchant-shell px-4 pt-4 pb-3">
        <div class="flex items-center justify-between mb-3">
          <button class="inline-flex items-center gap-2 text-white/90 text-sm font-semibold">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Back
          </button>
          <span class="text-xs font-semibold uppercase tracking-[0.22em] text-white/80">Merchant ATM QR</span>
          <div class="w-14"></div>
        </div>

        <div class="merchant-panel">
          <div class="px-3.5 pt-3.5 pb-2 text-center">
            <div class="merchant-chip">
              <i data-lucide="qr-code" class="w-3.5 h-3.5"></i>
              QR Merchant ATM
            </div>
          </div>

          <div class="px-3.5 pb-3.5">
            <div class="merchant-illustration rounded-2xl bg-white p-1.5">
              <img src="../assets/icons/merchant1.png" alt="Merchant icon" />
            </div>
          </div>
        </div>
      </div>

      <div class="bg-white px-5 pb-3">
        <div class="section-card pt-3.5">
          <div class="atm-detail-card">
            <div class="atm-detail-row atm-detail-row--top">
              <div class="atm-detail-icon">
                <i data-lucide="credit-card" style="width:18px;height:18px;"></i>
              </div>
              <div class="min-w-0">
                <p class="atm-detail-label">Merchant ATM Name</p>
                <div class="flex items-center gap-3 min-w-0">
                  <h1 class="atm-detail-title truncate">VLINKPAY MERCHANT ATM 01</h1>
                  <i data-lucide="badge-check" style="width:20px;height:20px;" class="shrink-0 text-orange-500"></i>
                </div>
                <div class="mt-5">
                  <p class="atm-detail-label">Merchant ATM ID</p>
                  <h2 class="atm-detail-subtitle">MAT-4K9P2X</h2>
                </div>
              </div>
            </div>

            <div class="atm-detail-row">
              <div class="atm-detail-icon">
                <i data-lucide="smartphone" style="width:17px;height:17px;"></i>
              </div>
              <div class="min-w-0">
                <p class="atm-detail-label">Status</p>
                <div class="atm-status-pill w-fit">
                  <span class="atm-status-dot"></span>
                  <span>Online</span>
                </div>
              </div>
            </div>

            <div class="atm-detail-row">
              <div class="atm-detail-icon">
                <i data-lucide="map-pin" style="width:17px;height:17px;"></i>
              </div>
              <div class="min-w-0">
                <p class="atm-location-text">Quận 1, TP. Hồ Chí Minh</p>
              </div>
            </div>
          </div>

          <div class="mt-4 pt-3 border-t border-slate-100">
            <a href="merchant-atm-info.html" class="block qr-shell transition-transform duration-200 hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-[color:var(--brand-primary)] focus:ring-offset-2">
              <span class="qr-corner tl"></span>
              <span class="qr-corner tr"></span>
              <span class="qr-corner bl"></span>
              <span class="qr-corner br"></span>
              <div class="bg-white rounded-[18px] p-2.5">
                <div id="merchant-atm-qr" class="merchant-qr-canvas" aria-label="Merchant ATM QR code"></div>
              </div>
              <div class="qr-logo">
                <img src="https://staging-web-app.vlinkpay.com/assets/images/logoVlink.png" alt="Vlink logo" class="w-full h-full object-contain" />
              </div>
            </a>
          </div>
        </div>
      </div>

      <div class="cta-bar px-5 py-3 text-white">
        <div class="flex items-center gap-3">
          <div class="shrink-0 w-10 h-10 rounded-2xl bg-white/15 flex items-center justify-center border border-white/15">
            <i data-lucide="scan-line" class="w-5 h-5"></i>
          </div>
          <div class="min-w-0">
            <p class="text-[13px] font-bold leading-5">Quét để giao dịch trực tiếp với Merchant</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const qrHost = document.getElementById('merchant-atm-qr');
      if (!qrHost || typeof window.QRCode !== 'function') return;

      const qrUrl = new URL('/atm-qr/merchant-atm-info.html', window.location.origin).toString();

      qrHost.innerHTML = '';
      new QRCode(qrHost, {
        text: qrUrl,
        width: 168,
        height: 168,
        colorDark: '#0f172a',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M,
      });
    });
  </script>
</body>

</html>
