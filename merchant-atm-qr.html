<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Merchant ATM QR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-primary: #d97706;
      --brand-orange: #e67e22;
      --brand-primary-deep: #b45309;
      --brand-primary-soft: #fef3c7;
      --surface: #ffffff;
      --ink: #221f1f;
      --muted: #757575;
      --line: rgba(217, 119, 6, 0.12);
      --card-shadow: 0 18px 42px rgba(17, 24, 39, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top right, rgba(254, 243, 199, 0.82), transparent 24%),
        linear-gradient(180deg, #fffdf9 0%, #ffffff 32%, #fff 100%);
    }

    .screen-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .phone-frame {
      width: 100%;
      max-width: 392px;
      border-radius: 26px;
      overflow: hidden;
      background: linear-gradient(180deg, #fffaf0 0%, #ffffff 16%, #ffffff 100%);
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(217, 119, 6, 0.08);
    }

    .hero-top {
      background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
      color: #fff;
    }

    .merchant-illustration {
      width: 100%;
      max-width: 230px;
      margin: 0 auto;
    }

    .merchant-illustration img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .section-card {
      border-top: 1px solid rgba(217, 119, 6, 0.08);
    }

    .method-pill {
      border: 1px solid rgba(217, 119, 6, 0.12);
      background: linear-gradient(180deg, #ffffff 0%, #fffaf0 100%);
      box-shadow: 0 10px 20px rgba(217, 119, 6, 0.04);
    }

    .method-icon {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .qr-shell {
      position: relative;
      padding: 18px;
      border-radius: 22px;
      background: #fff;
      box-shadow: inset 0 0 0 1px rgba(217, 119, 6, 0.12);
    }

    .qr-logo {
      position: absolute;
      inset: 50% auto auto 50%;
      width: 56px;
      height: 56px;
      transform: translate(-50%, -50%);
      border-radius: 16px;
      padding: 8px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 10px 22px rgba(17, 24, 39, 0.12);
      z-index: 2;
      pointer-events: none;
    }

    .qr-corner {
      position: absolute;
      width: 34px;
      height: 34px;
      border: 4px solid var(--brand-primary);
    }

    .qr-corner.tl {
      top: 8px;
      left: 8px;
      border-right: 0;
      border-bottom: 0;
      border-radius: 18px 0 0 0;
    }

    .qr-corner.tr {
      top: 8px;
      right: 8px;
      border-left: 0;
      border-bottom: 0;
      border-radius: 0 18px 0 0;
    }

    .qr-corner.bl {
      bottom: 8px;
      left: 8px;
      border-right: 0;
      border-top: 0;
      border-radius: 0 0 0 18px;
    }

    .qr-corner.br {
      bottom: 8px;
      right: 8px;
      border-left: 0;
      border-top: 0;
      border-radius: 0 0 18px 0;
    }

    .cta-bar {
      background: linear-gradient(180deg, #e67e22 0%, #d97706 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }

    @media (min-width: 700px) {
      .phone-frame {
        transform: scale(1.02);
      }
    }
  </style>
</head>

<body class="antialiased">
  <main class="screen-shell">
    <section class="phone-frame">
      <div class="hero-top px-4 pt-4 pb-3">
        <div class="flex items-center justify-between mb-3">
          <button class="inline-flex items-center gap-2 text-white/90 text-sm font-semibold">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Back
          </button>
          <span class="text-xs font-semibold uppercase tracking-[0.22em] text-white/80">Merchant ATM QR</span>
          <div class="w-14"></div>
        </div>

          <div class="rounded-[24px] bg-white overflow-hidden shadow-[0_10px_24px_rgba(17,24,39,0.08)]">
            <div class="px-3.5 pt-3.5 pb-2 text-center">
              <div class="inline-flex items-center gap-2 rounded-full bg-[color:var(--brand-primary-soft)] px-3 py-1 text-[10px] font-bold uppercase tracking-[0.18em] text-[color:var(--brand-primary-deep)]">
                <i data-lucide="qr-code" class="w-3.5 h-3.5"></i>
                QR Merchant ATM
              </div>
            </div>

            <div class="px-3.5 pb-3.5">
              <div class="merchant-illustration rounded-2xl bg-white p-1.5">
                <img src="assets/icons/merchant1.png" alt="Merchant icon" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="bg-white px-5 pb-3">
        <div class="section-card pt-3.5">
          <p class="text-center text-[13px] font-semibold text-slate-500 mb-1">Merchant ID</p>
          <h1 class="text-center text-[24px] leading-none font-black tracking-[-0.04em] text-slate-900">MCH-8J2NIV</h1>

          <div class="mt-2.5 flex items-center justify-center gap-2 text-slate-500">
            <i data-lucide="map-pin" class="w-4 h-4"></i>
            <span class="text-[13px] font-medium">Quận 1, TP. Hồ Chí Minh</span>
          </div>

          <div class="mt-3 border-t border-dashed border-slate-200 pt-3">
            <p class="text-center text-[13px] font-bold text-slate-700 mb-2.5">Phương thức chấp nhận</p>
            <div class="grid grid-cols-2 gap-3">
              <div class="method-pill rounded-2xl px-3 py-2.5 flex items-center justify-center gap-2">
                <span class="method-icon bg-emerald-50 text-emerald-600">
                  <i data-lucide="banknote" class="w-4 h-4"></i>
                </span>
                <span class="text-[13px] font-semibold text-slate-700">Cash</span>
              </div>
              <div class="method-pill rounded-2xl px-3 py-2.5 flex items-center justify-center gap-2">
                <span class="method-icon bg-orange-50 text-[color:var(--brand-primary)]">
                  <i data-lucide="building-2" class="w-4 h-4"></i>
                </span>
                <span class="text-[13px] font-semibold text-slate-700">Bank Transfer</span>
              </div>
            </div>
          </div>

          <div class="mt-4 pt-3 border-t border-slate-100">
            <div class="qr-shell">
              <span class="qr-corner tl"></span>
              <span class="qr-corner tr"></span>
              <span class="qr-corner bl"></span>
              <span class="qr-corner br"></span>
              <div class="bg-white rounded-[18px] p-2.5">
                <img src="images/qrcode.png" alt="Merchant ATM QR code" class="w-full h-auto rounded-[12px]" />
              </div>
              <div class="qr-logo">
                <img src="https://staging-web-app.vlinkpay.com/assets/images/logoVlink.png" alt="Vlink logo" class="w-full h-full object-contain" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="cta-bar px-5 py-3 text-white">
        <div class="flex items-center gap-3">
          <div class="shrink-0 w-10 h-10 rounded-2xl bg-white/15 flex items-center justify-center border border-white/15">
            <i data-lucide="scan-line" class="w-5 h-5"></i>
          </div>
          <div class="min-w-0">
            <p class="text-[13px] font-bold leading-5">Quét để giao dịch trực tiếp với Merchant</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    lucide.createIcons();
  </script>
</body>

</html>
