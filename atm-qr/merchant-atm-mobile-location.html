<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Confirm meeting location</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="merchant-atm-common.css" />
  <script defer src="merchant-atm-common.js"></script>
</head>

<body class="antialiased">
  <main class="screen-shell">
    <section class="mobile-location-frame" data-mobile-location-root>
      <header class="mobile-location-header">
        <a href="merchant-atm-order.html?type=buy&atmType=mobile" data-mobile-location-back class="mobile-location-back">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          <span>Back</span>
        </a>
        <h1 class="mobile-location-title">Confirm meeting location</h1>
        <div></div>
      </header>

      <div class="mobile-location-body">
        <div class="mobile-location-search">
          <span>Hcm, Ho Chi Minh City, Ho Chi Minh, Vietnam</span>
          <i data-lucide="search" class="w-5 h-5 text-[color:var(--brand-primary)] shrink-0"></i>
        </div>

        <button type="button" class="mobile-location-current">
          <i data-lucide="locate-fixed" class="w-5 h-5"></i>
          <span>Use my current location</span>
        </button>

        <div class="mobile-location-map" aria-label="Meeting location map">
          <img src="https://i.ibb.co/RG2pyKYP/Screenshot-2026-04-17-at-16-30-08.png" alt="Meeting location map" />
        </div>

        <div class="mobile-location-field">
          <label class="mobile-location-label">Phone Number</label>
          <div class="mobile-phone-input">
            <div class="mobile-phone-code">
              <span>+1</span>
              <i data-lucide="chevron-down" class="w-4 h-4 text-slate-500"></i>
            </div>
            <div class="mobile-phone-number">(123)-456-7890</div>
          </div>
        </div>

        <div class="mobile-location-field">
          <label class="mobile-location-label" for="mobile-atm-note">Note for Mobile ATM</label>
          <textarea id="mobile-atm-note" class="mobile-location-textarea" maxlength="100" data-mobile-location-note></textarea>
          <div class="mobile-location-counter" data-mobile-location-counter>0/100</div>
        </div>

        <div class="mobile-location-actions">
          <a href="merchant-atm-review.html?type=buy&atmType=mobile" data-mobile-location-continue class="mobile-location-ok primary-btn">OK</a>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
