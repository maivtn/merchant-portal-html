<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đánh giá - Nexora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }

    @keyframes pop-in {
      0% { transform: scale(0) rotate(-15deg); opacity: 0; }
      70% { transform: scale(1.15) rotate(3deg); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    @keyframes slide-up {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .animate-pop { animation: pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }
    .animate-up-1 { animation: slide-up 0.4s ease 0.15s both; }
    .animate-up-2 { animation: slide-up 0.4s ease 0.3s both; }
    .animate-up-3 { animation: slide-up 0.4s ease 0.45s both; }

    .tag-chip { transition: all 0.15s ease; }
    .tag-chip.selected {
      background-color: #10b981;
      color: white;
      border-color: #10b981;
    }

    .star-btn { transition: all 0.1s ease; }
    .star-btn:hover svg, .star-btn.active svg { fill: #f59e0b; stroke: #f59e0b; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-50 via-white to-teal-50">

  <!-- Header -->
  <div class="bg-white border-b border-gray-100 sticky top-0 z-10 shadow-sm">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <img src="images/logo-light-mode.png" alt="Nexora" class="h-7 object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'"/>
      <span style="display:none" class="text-xl font-bold text-emerald-600">Nexora</span>
      <span class="text-sm text-gray-900 font-medium">Tip &amp; Review</span>
    </div>
  </div>

  <div class="max-w-md mx-auto px-4 py-8 space-y-5">

    <!-- Success Icon -->
    <div class="flex flex-col items-center text-center animate-pop">
      <div class="w-20 h-20 rounded-full bg-gradient-to-br from-emerald-400 to-teal-500 flex items-center justify-center shadow-xl shadow-emerald-200 mb-4">
        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <h1 class="text-2xl font-black text-gray-800">Tip Sent! 🎉</h1>
      <p class="text-gray-400 text-sm mt-1">Cảm ơn sự hào phóng của bạn!</p>
    </div>

    <!-- Receipt Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden animate-up-1">
      <!-- Staff row -->
      <div class="p-5 flex items-center gap-3 border-b border-gray-50">
        <div id="staffAvatar" class="w-12 h-12 rounded-xl bg-gradient-to-br from-violet-400 to-purple-600 flex items-center justify-center text-white text-lg font-bold shadow-sm select-none">
          M
        </div>
        <div>
          <p class="font-bold text-gray-800" id="staffName">Mary S.</p>
          <p class="text-sm text-gray-400" id="staffRole">Nail Technician</p>
        </div>
        <div class="ml-auto">
          <div class="flex">
            <svg class="w-4 h-4 text-amber-400 fill-amber-400" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
            <svg class="w-4 h-4 text-amber-400 fill-amber-400" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
            <svg class="w-4 h-4 text-amber-400 fill-amber-400" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
            <svg class="w-4 h-4 text-amber-400 fill-amber-400" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
            <svg class="w-4 h-4 text-gray-200 fill-gray-200" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
          </div>
        </div>
      </div>

      <!-- Totals -->
      <div class="px-5 py-4 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium text-gray-400 uppercase tracking-wider">Total Tip</span>
          <span class="text-2xl font-black text-emerald-600" id="tipAmount">$15.00</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium text-gray-400 uppercase tracking-wider">Via</span>
          <div class="flex items-center gap-2">
            <img id="payIconImg" src="" alt="" class="w-8 h-8 rounded-full object-cover shadow-sm" />
            <span class="text-sm font-bold text-gray-700" id="payBadge">Zelle</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Review Section -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden animate-up-2">
      <div class="bg-gradient-to-r from-amber-50 to-orange-50 border-b border-amber-100 px-5 py-4">
        <h3 class="font-bold text-gray-800 text-base">Đánh giá dịch vụ</h3>
        <p class="text-sm text-gray-500 mt-0.5">Dịch vụ đã hoàn tất. Hãy đánh giá trải nghiệm của bạn.</p>
      </div>

      <div class="p-5 space-y-5">
        <!-- Star Rating -->
        <div>
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Mức độ hài lòng</p>
          <div class="flex items-center gap-2" id="starRating">
            <button class="star-btn active" onclick="setRating(1)">
              <svg class="w-9 h-9 fill-amber-400 stroke-amber-400" viewBox="0 0 24 24" stroke-width="1">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
              </svg>
            </button>
            <button class="star-btn active" onclick="setRating(2)">
              <svg class="w-9 h-9 fill-amber-400 stroke-amber-400" viewBox="0 0 24 24" stroke-width="1">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
              </svg>
            </button>
            <button class="star-btn active" onclick="setRating(3)">
              <svg class="w-9 h-9 fill-amber-400 stroke-amber-400" viewBox="0 0 24 24" stroke-width="1">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
              </svg>
            </button>
            <button class="star-btn active" onclick="setRating(4)">
              <svg class="w-9 h-9 fill-amber-400 stroke-amber-400" viewBox="0 0 24 24" stroke-width="1">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
              </svg>
            </button>
            <button class="star-btn" onclick="setRating(5)">
              <svg class="w-9 h-9 fill-gray-200 stroke-gray-200" viewBox="0 0 24 24" stroke-width="1">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
              </svg>
            </button>
          </div>
          <p class="text-xs text-gray-400 mt-1.5" id="ratingLabel">Rất tốt</p>
        </div>

        <!-- Quick Tags -->
        <div>
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Gợi ý nhận xét</p>
          <div class="flex flex-wrap gap-2">
            <button onclick="toggleTag(this)" class="tag-chip border border-gray-200 text-gray-600 text-sm font-medium px-3.5 py-1.5 rounded-full hover:border-emerald-300">Nhanh chóng</button>
            <button onclick="toggleTag(this)" class="tag-chip border border-gray-200 text-gray-600 text-sm font-medium px-3.5 py-1.5 rounded-full hover:border-emerald-300">Đúng hẹn</button>
            <button onclick="toggleTag(this)" class="tag-chip border border-gray-200 text-gray-600 text-sm font-medium px-3.5 py-1.5 rounded-full hover:border-emerald-300">Uy tín</button>
            <button onclick="toggleTag(this)" class="tag-chip border border-gray-200 text-gray-600 text-sm font-medium px-3.5 py-1.5 rounded-full hover:border-emerald-300">Giao tiếp tốt</button>
            <button onclick="toggleTag(this)" class="tag-chip border border-gray-200 text-gray-600 text-sm font-medium px-3.5 py-1.5 rounded-full hover:border-emerald-300">Làm đẹp</button>
            <button onclick="toggleTag(this)" class="tag-chip border border-gray-200 text-gray-600 text-sm font-medium px-3.5 py-1.5 rounded-full hover:border-emerald-300">Chuyên nghiệp</button>
          </div>
        </div>

        <!-- Comment -->
        <div>
          <textarea
            id="reviewText"
            rows="3"
            placeholder="Nhập nhận xét hoặc chọn gợi ý bên trên..."
            class="w-full text-sm text-gray-700 border border-gray-200 rounded-xl px-4 py-3 resize-none focus:outline-none focus:border-emerald-400 placeholder-gray-300 transition"
          ></textarea>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex gap-3 animate-up-3 pb-6">
      <button
        onclick="submitReview()"
        class="flex-1 py-4 bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-bold rounded-2xl shadow-lg shadow-emerald-200 hover:shadow-emerald-300 hover:from-emerald-600 hover:to-teal-600 active:scale-95 transition-all duration-200 flex items-center justify-center gap-2"
      >
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
        Gửi đánh giá
      </button>
      <button
        onclick="skipReview()"
        class="px-6 py-4 bg-gray-100 text-gray-600 font-bold rounded-2xl hover:bg-gray-200 active:scale-95 transition-all duration-200"
      >
        Bỏ qua
      </button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm font-medium px-5 py-3 rounded-2xl shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none z-50">
    ✓ Cảm ơn đánh giá của bạn!
  </div>

  <script>
    const paymentIcons = {
      zelle:   { icon: '../atm-qr/icons/zelle.png',       badge: 'Zelle' },
      venmo:   { icon: '../atm-qr/icons/venmo.png',       badge: 'Venmo' },
      cashapp: { icon: '../atm-qr/icons/cash_app.png',    badge: 'Cash App' },
      apple:   { icon: '../atm-qr/icons/apple_cash.png',  badge: 'Apple Cash' },
      paypal:  { icon: '../atm-qr/icons/paypal.png',      badge: 'PayPal' },
      vlinkpay: { icon: '../atm-qr/icons/vlinkpay.png',   badge: 'VLinkPay' },
    };

    const ratingLabels = ['', 'Tệ', 'Chưa tốt', 'Bình thường', 'Rất tốt', 'Xuất sắc'];
    let currentRating = 4;

    function initPage() {
      const params = new URLSearchParams(window.location.search);
      const amount  = params.get('amount') || '15.00';
      const via     = params.get('via') || 'zelle';
      const staff   = params.get('staff')  || 'Mary S.';
      const role    = params.get('role')   || 'Nail Technician';
      const initial = params.get('initial') || staff.charAt(0);

      document.getElementById('tipAmount').textContent = '$' + parseFloat(amount).toFixed(2);
      document.getElementById('staffName').textContent = staff;
      document.getElementById('staffRole').textContent = role;
      document.getElementById('staffAvatar').textContent = initial;

      const pi = paymentIcons[via] || paymentIcons.zelle;
      document.getElementById('payIconImg').src = pi.icon;
      document.getElementById('payIconImg').alt = pi.badge;
      document.getElementById('payBadge').textContent = pi.badge;
    }

    function setRating(n) {
      currentRating = n;
      const stars = document.querySelectorAll('.star-btn');
      stars.forEach((btn, i) => {
        const svg = btn.querySelector('svg');
        if (i < n) {
          btn.classList.add('active');
          svg.setAttribute('class', 'w-9 h-9 fill-amber-400 stroke-amber-400');
        } else {
          btn.classList.remove('active');
          svg.setAttribute('class', 'w-9 h-9 fill-gray-200 stroke-gray-200');
        }
      });
      document.getElementById('ratingLabel').textContent = ratingLabels[n];
    }

    function toggleTag(btn) {
      btn.classList.toggle('selected');
      if (btn.classList.contains('selected')) {
        const cur = document.getElementById('reviewText').value.trim();
        const tag = btn.textContent.trim();
        if (!cur.includes(tag)) {
          document.getElementById('reviewText').value = cur ? cur + ', ' + tag : tag;
        }
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.opacity = '1';
      setTimeout(() => t.style.opacity = '0', 2500);
    }

    function submitReview() {
      showToast('✓ Cảm ơn đánh giá của bạn!');
      setTimeout(() => {
        window.location.href = 'tip.html';
      }, 2000);
    }

    function skipReview() {
      window.location.href = 'tip.html';
    }

    initPage();
  </script>
</body>
</html>
