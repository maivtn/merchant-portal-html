<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chọn nhân viên - Nexora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }

    .staff-card { transition: all 0.18s ease; cursor: pointer; }
    .staff-card:hover { border-color: #c4b5fd; background: #faf7ff; }
    .staff-card.selected { border-color: #6c4df6; background: #f5f3ff; }
    .staff-card .radio-dot {
      width: 20px; height: 20px;
      border: 2px solid #d1d5db;
      border-radius: 50%;
      transition: all 0.15s ease;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .staff-card.selected .radio-dot {
      border-color: #6c4df6;
      background: #6c4df6;
    }
    .staff-card.selected .radio-dot::after {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: white;
    }

    .btn-glow-pulse { position: relative; }
    .btn-glow-pulse::after {
      content: '';
      position: absolute;
      inset: -2.5px;
      border-radius: 9999px;
      background: linear-gradient(90deg, #6c4df6, #16b7ff);
      z-index: -1;
      opacity: 0.55;
      filter: blur(6px);
      animation: pulseGlow 2.5s infinite alternate;
    }
    @keyframes pulseGlow {
      from { opacity: 0.4; filter: blur(5px); }
      to   { opacity: 0.75; filter: blur(9px); }
    }

    .list-scroll::-webkit-scrollbar { width: 3px; }
    .list-scroll::-webkit-scrollbar-track { background: transparent; }
    .list-scroll::-webkit-scrollbar-thumb { background: #c4b5fd; border-radius: 99px; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-50 via-white to-teal-50">

  <!-- Header -->
  <div class="bg-white border-b border-gray-100 sticky top-0 z-10 shadow-sm">
    <div class="max-w-md mx-auto px-4 py-2.5 flex items-center justify-between">
      <img src="images/logo-light-mode.png" alt="Nexora" class="h-6 object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'"/>
      <span style="display:none" class="text-lg font-bold text-emerald-600">Nexora</span>
      <span class="text-sm text-gray-900 font-medium">Tip &amp; Review</span>
    </div>
  </div>

  <div class="max-w-md mx-auto px-3 py-4 flex flex-col" style="height: calc(100vh - 53px);">

    <!-- Title -->
    <div class="text-center mb-4">
      <h1 class="text-lg font-extrabold text-gray-800 uppercase tracking-wide">Who served you today?</h1>
      <p class="text-xs text-gray-400 mt-0.5">Select the staff member you'd like to tip.</p>
    </div>

    <!-- Search -->
    <div class="relative mb-3">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input
        id="searchInput"
        type="text"
        placeholder="Search staff..."
        oninput="filterStaff()"
        class="w-full pl-9 pr-3 py-2.5 text-sm text-gray-700 bg-white border border-gray-200 rounded-xl focus:outline-none focus:border-violet-400 placeholder-gray-300 transition"
      />
    </div>

    <!-- Staff List -->
    <div id="staffList" class="flex-1 overflow-y-auto list-scroll space-y-2 pr-0.5 pb-2">
      <!-- rendered by JS -->
    </div>

    <!-- NEXT Button -->
    <div class="pt-3 pb-1">
      <button
        id="nextBtn"
        onclick="goNext()"
        class="btn-glow-pulse w-full relative py-3.5 text-white text-sm font-extrabold rounded-full shadow-md transition-all duration-300 hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-2 disabled:opacity-40"
        style="background: linear-gradient(90deg, #6c4df6 0%, #4f46e5 100%);"
      >
        NEXT
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const STAFF = [
      { name: 'David L.',  role: 'Nail Technician',       initial: 'D', from: '#7c3aed', to: '#6d28d9' },
      { name: 'Sunny K.',  role: 'Senior Gel Specialist',  initial: 'S', from: '#0ea5e9', to: '#3b82f6' },
      { name: 'Jenny T.',  role: 'Senior Nail Technician', initial: 'J', from: '#ec4899', to: '#be185d' },
      { name: 'Kevin V.',  role: 'Acrylic & Gel Specialist', initial: 'K', from: '#f59e0b', to: '#d97706' },
      { name: 'Mary S.',   role: 'Nail Technician',        initial: 'M', from: '#6c4df6', to: '#4f46e5' },
      { name: 'Lisa N.',   role: 'Gel & Extensions',       initial: 'L', from: '#10b981', to: '#0d9488' },
    ];

    let selectedIndex = null;
    let filteredStaff = [...STAFF];

    function renderList(list) {
      const container = document.getElementById('staffList');
      if (list.length === 0) {
        container.innerHTML = `<p class="text-center text-sm text-gray-300 py-8">Không tìm thấy nhân viên</p>`;
        return;
      }
      container.innerHTML = list.map((s, i) => {
        const origIdx = STAFF.indexOf(s);
        const isSel = origIdx === selectedIndex;
        return `
          <div class="staff-card ${isSel ? 'selected' : ''} bg-white border-2 border-gray-100 rounded-xl px-3 py-2.5 flex items-center gap-3"
               onclick="selectStaff(${origIdx})">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white text-sm font-bold shadow-sm shrink-0 select-none"
                 style="background: linear-gradient(135deg, ${s.from}, ${s.to})">
              ${s.initial}
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-bold text-gray-800 leading-tight">${s.name}</p>
              <p class="text-xs text-gray-400">${s.role}</p>
            </div>
            <div class="radio-dot"></div>
          </div>
        `;
      }).join('');
    }

    function filterStaff() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      filteredStaff = q ? STAFF.filter(s => s.name.toLowerCase().includes(q) || s.role.toLowerCase().includes(q)) : [...STAFF];
      renderList(filteredStaff);
    }

    function selectStaff(idx) {
      selectedIndex = idx;
      renderList(filteredStaff);
    }

    function goNext() {
      if (selectedIndex === null) {
        const list = document.getElementById('staffList');
        list.animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }], { duration: 300 });
        return;
      }
      const s = STAFF[selectedIndex];
      const params = new URLSearchParams({
        staff: s.name,
        role: s.role,
        initial: s.initial,
        from: s.from,
        to: s.to,
      });
      window.location.href = 'tip.html?' + params.toString();
    }

    renderList(STAFF);
  </script>
</body>
</html>
