<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In - VLINKPAY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="global.css" />
  <style>
    body.sign-in-page {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--grey-100) 0%, var(--grey-200) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .signin-tabs-wrap {
      margin-bottom: 24px;
    }

    .signin-tabs-label {
      font-size: 13px;
      color: var(--grey-600);
      margin-bottom: 10px;
      font-weight: 500;
    }

    .signin-tabs {
      display: flex;
      background: var(--grey-100);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .signin-tab {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--grey-600);
      cursor: pointer;
      border: none;
      border-radius: 10px;
      background: transparent;
      font-family: inherit;
      transition: background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
    }

    .signin-tab:hover {
      color: var(--grey-800);
      background: rgba(255, 255, 255, 0.6);
    }

    .signin-tab.active {
      color: var(--primary-dark);
      background: #fff;
      box-shadow: var(--shadow-z1);
    }

    .signin-tab .tab-icon {
      flex-shrink: 0;
      color: inherit;
      opacity: 0.9;
    }

    .signin-pane {
      display: none;
    }

    .signin-pane.active {
      display: block;
    }

    .signin-field {
      margin-bottom: 16px;
    }

    .signin-field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--grey-800);
      margin-bottom: 6px;
    }

    .signin-field input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--grey-300);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: var(--grey-900);
      background: #fff;
      box-sizing: border-box;
    }

    .signin-field input:focus {
      outline: none;
      border-color: var(--primary-main);
    }

    .signin-field input::placeholder {
      color: var(--grey-500);
    }

    .signin-card-number-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .signin-card-number-wrap input {
      padding-right: 48px;
    }

    .signin-scan-btn {
      position: absolute;
      right: 10px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: transparent;
      color: var(--primary-main);
      padding: 0;
      transition: background 0.2s, color 0.2s;
    }

    .signin-scan-btn:hover {
      background: var(--grey-100);
      color: var(--primary-dark);
    }

    .signin-scan-btn svg {
      flex-shrink: 0;
    }

    .signin-password-wrap {
      position: relative;
    }

    .signin-password-wrap input {
      padding-right: 44px;
    }

    .signin-password-wrap .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--grey-500);
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    .signin-password-wrap .toggle-pw:hover {
      color: var(--grey-800);
    }

    .signin-forgot {
      text-align: right;
      margin: -8px 0 16px;
    }

    .signin-forgot a {
      font-size: 13px;
      color: var(--primary-main);
      text-decoration: none;
      font-weight: 500;
    }

    .signin-forgot a:hover {
      text-decoration: underline;
    }

    .signin-btn {
      width: 100%;
      padding: 12px 24px;
      background: var(--primary-main);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: 0.2s;
    }

    .signin-btn:hover {
      background: var(--primary-dark);
    }

    .signin-create {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: var(--grey-600);
    }

    .signin-create a {
      color: var(--primary-main);
      text-decoration: none;
      font-weight: 600;
    }

    .signin-create a:hover {
      text-decoration: underline;
    }

    .signin-scan-container {
      text-align: center;
      padding: 8px 0 16px;
    }

    .signin-scan-frame {
      width: 200px;
      height: 200px;
      margin: 0 auto 20px;
      border: 2px solid var(--grey-300);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .signin-scan-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--primary-main);
      box-shadow: 0 0 12px var(--primary-main);
      animation: signinScanMove 2.2s infinite linear;
      z-index: 2;
    }

    @keyframes signinScanMove {
      0% {
        top: 0;
      }

      100% {
        top: 100%;
      }
    }

    .signin-scan-text {
      font-size: 13px;
      color: var(--grey-600);
      margin: 0;
    }

    /* Forgot PIN modal on top of Sign In modal */
    .modal-overlay#forgotPinModal.active {
      z-index: 1001;
    }
  </style>
</head>

<body class="sign-in-page">
  <div class="modal-overlay active" id="signInModal" role="dialog" aria-modal="true" aria-labelledby="signInTitle">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 class="modal-title" id="signInTitle">Sign In</h2>
        <button type="button" class="modal-close-btn" onclick="closeSignInModal()" aria-label="Close">
          <i data-lucide="x" style="width:20px;height:20px;"></i>
        </button>
      </div>
      <p class="modal-subtitle" id="signInSubtitle">Sign in with your account</p>

      <div class="modal-body">
        <div class="signin-tabs-wrap">
          <!-- <p class="signin-tabs-label">Choose how you'd like to sign in</p> -->
          <div class="signin-tabs" role="tablist" aria-label="Sign in method">
            <button type="button" class="signin-tab active" role="tab" aria-selected="true" aria-controls="pane-account"
              id="tab-account" data-tab="account" onclick="switchSignInTab('account')">
              <i data-lucide="user" class="tab-icon" style="width:18px;height:18px;"></i>
              <span>Account</span>
            </button>
            <button type="button" class="signin-tab" role="tab" aria-selected="false" aria-controls="pane-card"
              id="tab-card" data-tab="card" onclick="switchSignInTab('card')">
              <i data-lucide="credit-card" class="tab-icon" style="width:18px;height:18px;"></i>
              <span>Card</span>
            </button>
          </div>
        </div>

        <!-- Tab 1: Account -->
        <div id="pane-account" class="signin-pane active" role="tabpanel" aria-labelledby="tab-account">
          <div class="signin-field">
            <label for="signinUsername">Username or Email</label>
            <input type="text" id="signinUsername" placeholder="Enter your username or email" />
          </div>
          <div class="signin-field">
            <label for="signinPassword">Password</label>
            <div class="signin-password-wrap">
              <input type="password" id="signinPassword" placeholder="Enter your password" />
              <button type="button" class="toggle-pw" onclick="togglePasswordVisibility('signinPassword', this)"
                aria-label="Toggle password visibility">
                <i data-lucide="eye-off" style="width:20px;height:20px;"></i>
              </button>
            </div>
          </div>
          <div class="signin-forgot">
            <a href="#">Forgot Password?</a>
          </div>
          <button type="button" class="signin-btn" onclick="submitAccountSignIn()">Sign in</button>
          <p class="signin-create">
            New on our platform? <a href="#">Create an account</a>
          </p>
        </div>

        <!-- Tab 2: Card Number / PIN -->
        <div id="pane-card" class="signin-pane" role="tabpanel" aria-labelledby="tab-card">
          <div class="signin-field">
            <label for="signinCardNumber">Card Number</label>
            <div class="signin-card-number-wrap">
              <input type="text" id="signinCardNumber" placeholder="Enter card number or scan..." maxlength="19" />
              <button type="button" class="signin-scan-btn" onclick="openSignInScanModal()"
                aria-label="Scan card QR code">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path
                    d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2" />
                  <rect x="7" y="7" width="3" height="3" rx="0.5" />
                  <rect x="14" y="7" width="3" height="3" rx="0.5" />
                  <rect x="7" y="14" width="3" height="3" rx="0.5" />
                  <path d="M14 14h1M14 17h1M17 14h1M17 17h1" />
                </svg>
              </button>
            </div>
          </div>
          <div class="signin-field">
            <label for="signinPin">PIN</label>
            <div class="signin-password-wrap">
              <input type="password" id="signinPin" placeholder="Enter PIN" maxlength="8" inputmode="numeric" />
              <button type="button" class="toggle-pw" onclick="togglePasswordVisibility('signinPin', this)"
                aria-label="Toggle PIN visibility">
                <i data-lucide="eye-off" style="width:20px;height:20px;"></i>
              </button>
            </div>
          </div>
          <div class="signin-forgot">
            <a href="#" onclick="openForgotPinModal(); return false;">Forgot PIN?</a>
          </div>
          <button type="button" class="signin-btn" onclick="submitCardSignIn()">Sign in</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Scan QR (Card Number) -->
  <div id="signInScanModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-content" onclick="event.stopPropagation()" style="max-width:360px;">
      <div class="modal-header">
        <span class="modal-title">Scan QR Code</span>
        <button type="button" class="modal-close-btn" onclick="closeSignInScanModal()" aria-label="Close">
          <i data-lucide="x" style="width:20px;height:20px;"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="signin-scan-container">
          <div class="signin-scan-frame">
            <div class="signin-scan-line"></div>
            <iconify-icon icon="solar:qr-code-bold-duotone" width="80" height="80"
              style="opacity:0.12;color:var(--grey-800);"></iconify-icon>
          </div>
          <p class="signin-scan-text">Position the QR code within the frame to scan</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Forgot PIN (Reset PIN) -->
  <div id="forgotPinModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-content" onclick="event.stopPropagation()" style="max-width:400px;">
      <div class="modal-header">
        <span class="modal-title">Forgot PIN</span>
        <button type="button" class="modal-close-btn" onclick="closeForgotPinModal()" aria-label="Close">
          <i data-lucide="x" style="width:20px;height:20px;"></i>
        </button>
      </div>
      <div class="modal-body">
        <p class="modal-subtitle" style="margin-top:0;">Enter your email to receive an OTP and set a new PIN.</p>
        <div class="signin-field">
          <label for="forgotPinEmail">Email <span style="color:var(--error-main);">*</span></label>
          <input type="email" id="forgotPinEmail" placeholder="Enter your email" />
        </div>
        <button type="button" class="signin-btn" id="sendForgotPinOtpBtn" onclick="sendForgotPinOtp()"
          style="margin-bottom:16px;">Send OTP</button>
        <div id="forgotPinOtpGroup" style="display:none;">
          <div class="signin-field">
            <label for="forgotPinOtp">OTP <span style="color:var(--error-main);">*</span></label>
            <input type="text" id="forgotPinOtp" placeholder="Enter OTP from email" maxlength="6" inputmode="numeric" />
          </div>
          <div class="signin-field">
            <label for="forgotPinNewPin">New PIN <span style="color:var(--error-main);">*</span></label>
            <input type="password" id="forgotPinNewPin" placeholder="Enter new PIN" maxlength="8" inputmode="numeric" />
          </div>
          <div class="signin-field">
            <label for="forgotPinConfirmPin">Confirm New PIN <span style="color:var(--error-main);">*</span></label>
            <input type="password" id="forgotPinConfirmPin" placeholder="Confirm new PIN" maxlength="8"
              inputmode="numeric" />
          </div>
          <div style="display:flex;gap:12px;margin-top:16px;">
            <button type="button" class="signin-btn" style="flex:1;background:var(--grey-500);"
              onclick="closeForgotPinModal()">Cancel</button>
            <button type="button" class="signin-btn" style="flex:1;" onclick="submitForgotPinReset()">Reset PIN</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof lucide !== 'undefined') lucide.createIcons();
      document.getElementById('signInModal').classList.add('active');
      document.getElementById('signInModal').style.display = 'flex';
    });

    function closeSignInModal() {
      var el = document.getElementById('signInModal');
      el.classList.remove('active');
      el.style.display = 'none';
    }

    document.getElementById('signInModal').addEventListener('click', function (e) {
      if (e.target === this) closeSignInModal();
    });

    function openSignInScanModal() {
      var el = document.getElementById('signInScanModal');
      el.classList.add('active');
      el.style.display = 'flex';
      el.setAttribute('aria-hidden', 'false');
      if (typeof lucide !== 'undefined') lucide.createIcons();
      setTimeout(function () {
        closeSignInScanModal();
        var cardInput = document.getElementById('signinCardNumber');
        if (cardInput) cardInput.value = '8888 1234 5678 1234';
      }, 2200);
    }
    function closeSignInScanModal() {
      var el = document.getElementById('signInScanModal');
      el.classList.remove('active');
      el.style.display = 'none';
      el.setAttribute('aria-hidden', 'true');
    }
    document.getElementById('signInScanModal').addEventListener('click', function (e) {
      if (e.target === this) closeSignInScanModal();
    });

    function openForgotPinModal() {
      var el = document.getElementById('forgotPinModal');
      el.classList.add('active');
      el.style.display = 'flex';
      document.getElementById('forgotPinEmail').value = '';
      document.getElementById('forgotPinOtp').value = '';
      document.getElementById('forgotPinNewPin').value = '';
      document.getElementById('forgotPinConfirmPin').value = '';
      document.getElementById('forgotPinOtpGroup').style.display = 'none';
      document.getElementById('sendForgotPinOtpBtn').disabled = false;
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }
    function closeForgotPinModal() {
      var el = document.getElementById('forgotPinModal');
      el.classList.remove('active');
      el.style.display = 'none';
    }
    document.getElementById('forgotPinModal').addEventListener('click', function (e) {
      if (e.target === this) closeForgotPinModal();
    });
    function sendForgotPinOtp() {
      var email = (document.getElementById('forgotPinEmail').value || '').trim();
      if (!email) { alert('Please enter your email to receive OTP.'); return; }
      document.getElementById('sendForgotPinOtpBtn').disabled = true;
      alert('OTP has been sent to ' + email + ' (demo).');
      document.getElementById('forgotPinOtpGroup').style.display = 'block';
      setTimeout(function () {
        document.getElementById('forgotPinOtp').value = '1234';
        document.getElementById('sendForgotPinOtpBtn').disabled = false;
      }, 300);
    }
    function submitForgotPinReset() {
      var otp = (document.getElementById('forgotPinOtp').value || '').trim();
      var newPin = (document.getElementById('forgotPinNewPin').value || '').trim();
      var confirmPin = (document.getElementById('forgotPinConfirmPin').value || '').trim();
      if (!otp) { alert('Please enter the OTP sent to your email.'); return; }
      if (!newPin || !confirmPin) { alert('Please enter and confirm your new PIN.'); return; }
      if (newPin !== confirmPin) { alert('New PIN and confirmation do not match.'); return; }
      alert('PIN has been reset successfully (demo).');
      closeForgotPinModal();
    }

    function switchSignInTab(tabId) {
      document.querySelectorAll('.signin-tab').forEach(function (t) {
        var isActive = t.getAttribute('data-tab') === tabId;
        t.classList.toggle('active', isActive);
        t.setAttribute('aria-selected', isActive ? 'true' : 'false');
      });
      document.querySelectorAll('.signin-pane').forEach(function (p) {
        p.classList.toggle('active', p.id === 'pane-' + tabId);
      });
      var subtitle = document.getElementById('signInSubtitle');
      subtitle.textContent = tabId === 'account' ? 'Sign in with your account' : 'Sign in with card number and PIN';
    }

    function togglePasswordVisibility(inputId, btn) {
      var input = document.getElementById(inputId);
      var icon = btn.querySelector('i');
      if (!input || !icon) return;
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye-off');
      }
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function submitAccountSignIn() {
      var username = document.getElementById('signinUsername').value.trim();
      var password = document.getElementById('signinPassword').value;
      if (!username) { alert('Please enter username or email.'); return; }
      if (!password) { alert('Please enter password.'); return; }
      console.log('Account sign in', { username: username });
    }

    function submitCardSignIn() {
      var cardNumber = document.getElementById('signinCardNumber').value.trim();
      var pin = document.getElementById('signinPin').value;
      if (!cardNumber) { alert('Please enter card number.'); return; }
      if (!pin) { alert('Please enter PIN.'); return; }
      console.log('Card sign in', { cardNumber: cardNumber });
    }
  </script>
</body>

</html>
