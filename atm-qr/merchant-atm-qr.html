<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Merchant ATM QR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      [data-row="status"], [data-row="fee"] { display: none !important; }
      .screen-shell { padding: 0; background: transparent; }
      body { background: transparent; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="merchant-atm-common.css" />
  <script defer src="merchant-atm-common.js"></script>
</head>

<body class="antialiased">
  <main class="screen-shell">
    <section class="phone-frame">
      <div class="merchant-shell px-2 pt-2 pb-2">
        <div class="merchant-panel">
          <div class="px-3.5 pt-3.5 text-center">
            <div class="merchant-chip">
              <i data-lucide="qr-code" class="w-3.5 h-3.5"></i>
              <span data-atm-qr-label>QR Merchant ATM</span>
            </div>
          </div>

          <div class="">
            <div class="merchant-illustration rounded-2xl bg-white p-1.5">
              <img src="../atm-qr/merchant.png" alt="Merchant icon" data-atm-image />
            </div>
          </div>
        </div>
      </div>

      <div class="bg-white px-5 pb-3" style="border-left: 1px solid rgba(217, 119, 6, 0.25); border-right: 1px solid rgba(217, 119, 6, 0.25);">
        <div class="section-card pt-3.5">
          <div class="atm-detail-card atm-detail-card--compact">
            <div class="atm-detail-row atm-detail-row--top">
              <div class="atm-detail-icon">
                <i data-lucide="credit-card" style="width:18px;height:18px;"></i>
              </div>
              <div class="min-w-0">
                <p class="atm-detail-label" data-atm-name-label>Merchant ATM Name</p>
                <div class="flex items-center gap-3 min-w-0">
                  <h1 class="atm-detail-title truncate" data-atm-name>VLINKPAY MERCHANT ATM 01</h1>
                  <i data-lucide="badge-check" style="width:20px;height:20px;" class="shrink-0 text-orange-500"></i>
                </div>
                <div class="mt-2.5">
                  <p class="atm-detail-label" data-atm-id-label>Merchant ATM ID</p>
                  <h2 class="atm-detail-subtitle" data-atm-id>MAT-4K9P2X</h2>
                </div>
              </div>
            </div>

            <div class="atm-detail-row" data-row="status">
              <div class="atm-detail-icon">
                <i data-lucide="smartphone" style="width:17px;height:17px;"></i>
              </div>
              <div class="min-w-0">
                <p class="atm-detail-label">Status</p>
                <div class="atm-status-pill w-fit">
                  <span class="atm-status-dot"></span>
                  <span data-atm-status>Online</span>
                </div>
              </div>
            </div>

            <div class="atm-detail-row" data-row="fee">
              <div class="atm-detail-icon">
                <i data-lucide="percent" style="width:17px;height:17px;"></i>
              </div>
              <div class="min-w-0">
                <p class="atm-detail-label">Phí giao dịch</p>
                <h2 class="atm-detail-subtitle" data-atm-fee-rate>1% - 5%</h2>
              </div>
            </div>

            <div class="atm-detail-row">
              <div class="atm-detail-icon">
                <i data-lucide="map-pin" style="width:17px;height:17px;"></i>
              </div>
              <div class="min-w-0">
                <p class="atm-location-text" data-atm-location>Quận 1, TP. Hồ Chí Minh</p>
              </div>
            </div>
          </div>

          <div class="mt-4 pt-3 border-t border-slate-100">
            <div data-atm-info-link class="block qr-shell qr-shell--compact transition-transform duration-200 hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-[color:var(--brand-primary)] focus:ring-offset-2">
              <span class="qr-corner tl"></span>
              <span class="qr-corner tr"></span>
              <span class="qr-corner bl"></span>
              <span class="qr-corner br"></span>
              <div class="bg-white rounded-[18px] p-2.5">
                <div id="merchant-atm-qr" class="merchant-qr-canvas" aria-label="Merchant ATM QR code"></div>
              </div>
              <div class="qr-logo">
                <img src="https://staging-web-app.vlinkpay.com/assets/images/logoVlink.png" alt="Vlink logo" class="w-full h-full object-contain" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="cta-bar px-5 py-3 text-white" style="border-bottom-left-radius: 26px; border-bottom-right-radius: 26px;">
        <div class="flex items-center gap-3">
          <div class="shrink-0 w-10 h-10 rounded-2xl bg-white/15 flex items-center justify-center border border-white/15">
            <i data-lucide="scan-line" class="w-5 h-5"></i>
          </div>
          <div class="min-w-0">
            <p class="text-[13px] font-bold leading-5" data-atm-cta>Quét để giao dịch trực tiếp với Merchant</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const qrHost = document.getElementById('merchant-atm-qr');
      if (!qrHost || typeof window.QRCode !== 'function') return;

      const params = new URLSearchParams(window.location.search);
      const atmType = params.get('atmType') === 'mobile' ? 'mobile' : 'merchant';
      const qrUrl = new URL(`/atm-qr/merchant-atm-info.html?atmType=${encodeURIComponent(atmType)}`, window.location.origin).toString();

      qrHost.innerHTML = '';
      new QRCode(qrHost, {
        text: qrUrl,
        width: 168,
        height: 168,
        colorDark: '#0f172a',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M,
      });
    });

    window.captureCardImage = async () => {
      if (typeof window.html2canvas !== 'function') return '';
      const target = document.querySelector('.phone-frame');
      if (!target) return '';

      await document.fonts.ready;

      const hiddenRows = Array.from(document.querySelectorAll('[data-row="status"], [data-row="fee"]'));
      hiddenRows.forEach(el => { el.style.display = 'none'; });

      try {
        const canvas = await window.html2canvas(target, {
          scale: 2,
          useCORS: true,
          allowTaint: false,
          backgroundColor: '#ffffff',
          logging: false,
        });
        hiddenRows.forEach(el => { el.style.display = ''; });
        return canvas.toDataURL('image/png');
      } catch {
        hiddenRows.forEach(el => { el.style.display = ''; });
        return '';
      }
    };
  </script>
</body>

</html>
