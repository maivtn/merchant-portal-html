<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tạo mã QR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <!-- QR code library (Kazuhiko Arase) — encodes UTF-8 correctly -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <style>
    :root {
      --primary-main: #00a76f;
      --primary-dark: #007a52;
      --grey-100: #f4f6f8;
      --grey-200: #e6e8eb;
      --grey-400: #c4cdd5;
      --grey-600: #637381;
      --grey-800: #212b36;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      font-size: 17px;
      color: var(--grey-800);
      background:
        radial-gradient(circle at top left, rgba(0, 167, 111, 0.12), transparent 32%),
        linear-gradient(180deg, #f4f6f8 0%, #eef1f3 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .qr-card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.12);
      width: 100%;
      max-width: 540px;
      overflow: hidden;
    }

    .qr-card__header {
      background: linear-gradient(135deg, var(--primary-main) 0%, var(--primary-dark) 100%);
      color: #fff;
      padding: 20px 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .qr-card__header .icon-badge {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.20);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }
    .qr-card__header h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0;
    }

    .qr-card__body { padding: 28px 26px 32px; }

    /* Step blocks */
    .step { margin-bottom: 26px; }
    .step-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .step-number {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--primary-main);
      color: #fff;
      font-weight: 700;
      font-size: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }
    .step-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--grey-800);
    }

    /* Big text input */
    .qr-textarea {
      resize: vertical;
      min-height: 120px;
      border-radius: 16px;
      border: 2px solid var(--grey-200);
      font-size: 19px;
      padding: 16px 18px;
      width: 100%;
    }
    .qr-textarea::placeholder { color: var(--grey-400); }
    .qr-textarea:focus,
    .form-control:focus {
      border-color: var(--primary-main);
      box-shadow: 0 0 0 4px rgba(0, 167, 111, 0.16);
      outline: none;
    }
    .form-control { font-size: 18px; }

    /* Avatar option cards */
    .opt-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 12px;
    }
    .opt-card {
      cursor: pointer;
      border: 2px solid var(--grey-200);
      border-radius: 16px;
      padding: 14px 6px;
      text-align: center;
      min-height: 98px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      margin: 0;
      background: #fff;
      color: var(--grey-800);
    }
    .opt-card iconify-icon { color: var(--grey-600); }
    .opt-card .opt-name { font-size: 14px; font-weight: 600; line-height: 1.2; }
    .opt-card:hover { border-color: var(--primary-main); }
    .btn-check:checked + .opt-card {
      border-color: var(--primary-main);
      background: rgba(0, 167, 111, 0.08);
      box-shadow: 0 0 0 3px rgba(0, 167, 111, 0.14);
    }
    .btn-check:checked + .opt-card iconify-icon { color: var(--primary-main); }
    .btn-check:focus-visible + .opt-card { border-color: var(--primary-main); }

    /* Mobile ≤ 400px: 2 options per row */
    @media (max-width: 400px) {
      .opt-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* Conditional inputs */
    .field-lg {
      min-height: 58px;
      border-radius: 14px;
      border: 2px solid var(--grey-200);
      font-size: 18px;
      padding: 12px 16px;
    }
    .btn-clear {
      min-height: 58px;
      border-radius: 14px;
      border: 2px solid var(--grey-200);
      padding: 0 16px;
    }

    /* Icon picker */
    .icon-picker {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
      gap: 10px;
      max-height: 224px;
      overflow-y: auto;
      padding: 4px;
    }
    .icon-choice {
      min-height: 56px;
      border: 2px solid var(--grey-200);
      border-radius: 14px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .icon-choice iconify-icon { color: var(--grey-800); }
    .icon-choice:hover { border-color: var(--primary-main); }
    .icon-choice.active {
      border-color: var(--primary-main);
      background: rgba(0, 167, 111, 0.10);
    }
    .icon-choice.active iconify-icon { color: var(--primary-main); }

    /* Preview row */
    .preview-row {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--grey-100);
      border-radius: 16px;
      padding: 14px 18px;
    }
    .preview-label { font-size: 15px; font-weight: 600; color: var(--grey-600); }
    .avatar-preview {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--grey-200);
      flex: 0 0 auto;
    }
    .avatar-chip {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary-main);
      color: #fff;
      font-weight: 700;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      text-transform: uppercase;
    }

    /* Big generate button */
    .btn-generate {
      background: var(--primary-main);
      border: none;
      color: #fff;
      font-weight: 700;
      font-size: 21px;
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 64px;
    }
    .btn-generate:hover { background: var(--primary-dark); color: #fff; }
    .btn-generate:active { transform: translateY(1px); }

    /* Result */
    .qr-result { margin-top: 28px; text-align: center; display: none; }
    .qr-result.is-visible { display: block; animation: qr-fade 0.25s ease; }
    @keyframes qr-fade {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .qr-box {
      display: inline-block;
      padding: 18px;
      background: #fff;
      border: 2px solid var(--grey-200);
      border-radius: 20px;
    }
    .qr-box canvas { display: block; width: 260px; height: 260px; }
    .btn-download {
      margin-top: 18px;
      min-height: 56px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 14px;
      border: 2px solid var(--primary-main);
      color: var(--primary-main);
      background: #fff;
      padding: 0 26px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-download:hover { background: var(--primary-main); color: #fff; }

    .invalid-note {
      display: none;
      color: #d32f2f;
      font-size: 15px;
      font-weight: 600;
      margin-top: 8px;
    }
    .invalid-note.show { display: block; }
  </style>
</head>

<body>
  <div class="qr-card">
    <div class="qr-card__header">
      <div class="icon-badge">
        <iconify-icon icon="solar:qr-code-bold" width="28"></iconify-icon>
      </div>
      <h1>Tạo mã QR</h1>
    </div>

    <div class="qr-card__body">
      <form id="qrForm" novalidate>

        <!-- Step 1 -->
        <div class="step">
          <div class="step-head">
            <span class="step-number">1</span>
            <span class="step-title">Nhập nội dung</span>
          </div>
          <textarea class="qr-textarea" id="qrInput"
            placeholder="Gõ chữ hoặc dán đường dẫn vào đây..." required></textarea>
          <div class="invalid-note" id="inputError">Vui lòng nhập nội dung trước khi tạo mã QR.</div>
        </div>

        <!-- Step 2 -->
        <div class="step">
          <div class="step-head">
            <span class="step-number">2</span>
            <span class="step-title">Chọn hình ở giữa</span>
          </div>

          <div class="opt-grid">
            <input type="radio" class="btn-check" name="avatarType" id="atDefault" value="default" checked>
            <label class="opt-card" for="atDefault">
              <iconify-icon icon="solar:text-bold" width="28"></iconify-icon>
              <span class="opt-name">Chữ đầu<br>nội dung</span>
            </label>

            <input type="radio" class="btn-check" name="avatarType" id="atCustom" value="custom">
            <label class="opt-card" for="atCustom">
              <iconify-icon icon="solar:pen-bold" width="28"></iconify-icon>
              <span class="opt-name">Tự nhập<br>chữ</span>
            </label>

            <input type="radio" class="btn-check" name="avatarType" id="atIcon" value="icon">
            <label class="opt-card" for="atIcon">
              <iconify-icon icon="solar:emoji-funny-square-bold" width="28"></iconify-icon>
              <span class="opt-name">Chọn<br>Icon</span>
            </label>

            <input type="radio" class="btn-check" name="avatarType" id="atImage" value="image">
            <label class="opt-card" for="atImage">
              <iconify-icon icon="solar:gallery-bold" width="28"></iconify-icon>
              <span class="opt-name">Tải<br>hình ảnh</span>
            </label>
          </div>

          <!-- Tự nhập -->
          <div id="customWrap" class="mt-3 d-none">
            <input type="text" class="form-control field-lg w-100" id="customText" maxlength="3"
              placeholder="Nhập chữ hiển thị (tối đa 3 ký tự)">
          </div>

          <!-- Chọn icon -->
          <div id="iconWrap" class="mt-3 d-none">
            <div class="icon-picker" id="iconPicker"></div>
          </div>

          <!-- Hình ảnh -->
          <div id="imageWrap" class="mt-3 d-none">
            <div class="d-flex align-items-center gap-2">
              <input type="file" class="form-control field-lg" id="imageInput" accept="image/*">
              <button type="button" class="btn btn-clear d-none" id="clearImageBtn" title="Xóa hình">
                <iconify-icon icon="solar:trash-bin-trash-bold" width="22"></iconify-icon>
              </button>
            </div>
          </div>

          <!-- Preview -->
          <div class="preview-row mt-3">
            <span class="preview-label">Xem trước:</span>
            <img id="avatarPreview" class="avatar-preview d-none" alt="avatar">
            <div id="avatarIconChip" class="avatar-chip d-none">
              <iconify-icon id="avatarIconEl" icon="mdi:link-variant" width="30"></iconify-icon>
            </div>
            <div id="avatarLetter" class="avatar-chip">V</div>
          </div>
        </div>

        <!-- Step 3 -->
        <button type="submit" class="btn-generate">
          <iconify-icon icon="solar:qr-code-bold" width="26"></iconify-icon>
          Tạo mã QR
        </button>
      </form>

      <div class="qr-result" id="qrResult">
        <div class="qr-box">
          <canvas id="qrCanvas" width="512" height="512"></canvas>
        </div>
        <div>
          <button type="button" class="btn-download" id="downloadBtn">
            <iconify-icon icon="solar:download-minimalistic-bold" width="22"></iconify-icon>
            Tải ảnh về máy
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // Force UTF-8 byte encoding so Vietnamese / non-ASCII strings are correct
      qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];

      var form = document.getElementById('qrForm');
      var input = document.getElementById('qrInput');
      var inputError = document.getElementById('inputError');
      var result = document.getElementById('qrResult');
      var downloadBtn = document.getElementById('downloadBtn');
      var canvas = document.getElementById('qrCanvas');
      var ctx = canvas.getContext('2d');

      var customWrap = document.getElementById('customWrap');
      var iconWrap = document.getElementById('iconWrap');
      var imageWrap = document.getElementById('imageWrap');
      var customText = document.getElementById('customText');
      var imageInput = document.getElementById('imageInput');
      var clearImageBtn = document.getElementById('clearImageBtn');
      var iconPicker = document.getElementById('iconPicker');

      var avatarPreview = document.getElementById('avatarPreview');
      var avatarIconChip = document.getElementById('avatarIconChip');
      var avatarIconEl = document.getElementById('avatarIconEl');
      var avatarLetter = document.getElementById('avatarLetter');

      var TARGET = 512;             // approximate render resolution (px)
      var QUIET = 4;                // quiet-zone in modules (QR spec)
      var uploadedImage = null;     // Image element for uploaded avatar
      var selectedIcon = null;      // chosen icon name (e.g. "mdi:heart")
      var selectedIconImage = null; // preloaded white SVG Image for canvas

      // Curated icon list (Material Design Icons — reliable on the Iconify API)
      var ICONS = [
        // Dấu hỏi (question) — ưu tiên lên đầu
        'mdi:help', 'mdi:help-circle', 'mdi:help-box', 'mdi:comment-question',
        'mdi:chat-question', 'mdi:head-question', 'mdi:frequently-asked-questions',
        // Cảm xúc (emoji)
        'mdi:emoticon-happy', 'mdi:emoticon-cool', 'mdi:emoticon-excited', 'mdi:emoticon-lol',
        'mdi:emoticon-wink', 'mdi:emoticon-tongue', 'mdi:emoticon-kiss', 'mdi:emoticon',
        'mdi:emoticon-sad', 'mdi:emoticon-cry', 'mdi:emoticon-angry', 'mdi:emoticon-neutral',
        'mdi:emoticon-confused', 'mdi:emoticon-devil', 'mdi:emoticon-poop',
        // Ký tự vui
        'mdi:exclamation-thick', 'mdi:thumb-up', 'mdi:hand-wave',
        'mdi:party-popper', 'mdi:rocket-launch', 'mdi:crown', 'mdi:fire',
        'mdi:ghost', 'mdi:cake-variant', 'mdi:sunglasses', 'mdi:hand-peace',
        // Liên hệ & mạng xã hội
        'mdi:link-variant', 'mdi:phone', 'mdi:email', 'mdi:web', 'mdi:wifi', 'mdi:map-marker',
        'mdi:heart', 'mdi:star', 'mdi:home', 'mdi:cart', 'mdi:account', 'mdi:gift',
        'mdi:camera', 'mdi:music', 'mdi:wallet', 'mdi:bell',
        'mdi:facebook', 'mdi:instagram', 'mdi:youtube', 'mdi:whatsapp'
      ];

      function primaryColor() {
        return getComputedStyle(document.documentElement)
          .getPropertyValue('--primary-main').trim() || '#00a76f';
      }

      function avatarType() {
        var el = document.querySelector('input[name="avatarType"]:checked');
        return el ? el.value : 'default';
      }

      // Up to n leading (visible) characters, uppercased. Handles emoji/surrogate pairs.
      function leadingChars(text, n) {
        var t = (text || '').trim();
        return t ? Array.from(t).slice(0, n).join('').toUpperCase() : '';
      }

      function avatarText() {
        if (avatarType() === 'custom') {
          return (customText.value || '').trim().toUpperCase() || leadingChars(input.value, 1) || 'V';
        }
        return leadingChars(input.value, 1) || 'V';
      }

      // Sync the live preview chip with the current mode
      function syncPreview() {
        var type = avatarType();
        avatarPreview.classList.add('d-none');
        avatarIconChip.classList.add('d-none');
        avatarLetter.classList.add('d-none');

        if (type === 'image' && uploadedImage) {
          avatarPreview.classList.remove('d-none');
        } else if (type === 'icon' && selectedIcon) {
          avatarIconChip.classList.remove('d-none');
        } else {
          avatarLetter.classList.remove('d-none');
          avatarLetter.textContent = avatarText();
        }
      }

      // --- Build the icon picker ---
      function buildIconPicker() {
        ICONS.forEach(function (name) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'icon-choice';
          b.setAttribute('data-icon', name);
          b.innerHTML = '<iconify-icon icon="' + name + '" width="28"></iconify-icon>';
          b.addEventListener('click', function () { selectIcon(name, b); });
          iconPicker.appendChild(b);
        });
      }

      function selectIcon(name, btn) {
        selectedIcon = name;
        Array.prototype.forEach.call(iconPicker.children, function (c) {
          c.classList.toggle('active', c === btn);
        });
        avatarIconEl.setAttribute('icon', name);
        loadIconImage(name);   // preload white SVG for the canvas
        syncPreview();
      }

      // Fetch the icon SVG (white), turn it into a data URL Image so the canvas
      // stays untainted (download keeps working).
      function loadIconImage(name) {
        var url = 'https://api.iconify.design/' + name.replace(':', '/') +
          '.svg?color=%23ffffff&width=200&height=200';
        selectedIconImage = null;
        fetch(url)
          .then(function (r) { return r.text(); })
          .then(function (svg) {
            var img = new Image();
            img.onload = function () { selectedIconImage = img; };
            img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
          })
          .catch(function () { selectedIconImage = null; });
      }

      // --- Mode switching ---
      document.querySelectorAll('input[name="avatarType"]').forEach(function (r) {
        r.addEventListener('change', function () {
          var type = avatarType();
          customWrap.classList.toggle('d-none', type !== 'custom');
          iconWrap.classList.toggle('d-none', type !== 'icon');
          imageWrap.classList.toggle('d-none', type !== 'image');
          clearImageBtn.classList.toggle('d-none', !(type === 'image' && uploadedImage));
          if (type === 'icon' && !selectedIcon) selectIcon(ICONS[0], iconPicker.children[0]);
          syncPreview();
        });
      });

      customText.addEventListener('input', syncPreview);

      // --- Image upload ---
      imageInput.addEventListener('change', function () {
        var file = imageInput.files && imageInput.files[0];
        if (!file) return clearImage();
        var reader = new FileReader();
        reader.onload = function (e) {
          var img = new Image();
          img.onload = function () {
            uploadedImage = img;
            avatarPreview.src = e.target.result;
            clearImageBtn.classList.remove('d-none');
            syncPreview();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });

      function clearImage() {
        uploadedImage = null;
        imageInput.value = '';
        avatarPreview.src = '';
        clearImageBtn.classList.add('d-none');
        syncPreview();
      }
      clearImageBtn.addEventListener('click', clearImage);

      // Rounded-rect path helper
      function roundRect(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y);
        c.arcTo(x + w, y, x + w, y + h, r);
        c.arcTo(x + w, y + h, x, y + h, r);
        c.arcTo(x, y + h, x, y, r);
        c.arcTo(x, y, x + w, y, r);
        c.closePath();
      }

      // Draw the QR avatar (image / icon / letters) in the middle
      function drawAvatar(text, size) {
        var box = size * 0.22;                 // safe under error-correction level H
        var cx = size / 2, cy = size / 2;
        var pad = box * 0.12;
        var type = avatarType();

        // White rounded background so the QR stays scannable
        ctx.save();
        roundRect(ctx, cx - box / 2 - pad, cy - box / 2 - pad, box + pad * 2, box + pad * 2, (box + pad * 2) * 0.24);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();

        if (type === 'image' && uploadedImage) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy, box / 2, 0, Math.PI * 2);
          ctx.clip();
          var iw = uploadedImage.width, ih = uploadedImage.height;
          var scale = Math.max(box / iw, box / ih);   // cover-fit
          var dw = iw * scale, dh = ih * scale;
          ctx.drawImage(uploadedImage, cx - dw / 2, cy - dh / 2, dw, dh);
          ctx.restore();
        } else if (type === 'icon' && selectedIconImage) {
          // Primary circle + white icon
          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy, box / 2, 0, Math.PI * 2);
          ctx.fillStyle = primaryColor();
          ctx.fill();
          ctx.restore();
          var isize = box * 0.6;
          ctx.drawImage(selectedIconImage, cx - isize / 2, cy - isize / 2, isize, isize);
        } else {
          var letters = avatarText();
          var ratio = letters.length >= 3 ? 0.30 : (letters.length === 2 ? 0.40 : 0.5);
          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy, box / 2, 0, Math.PI * 2);
          ctx.fillStyle = primaryColor();
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.font = '700 ' + Math.round(box * ratio) + 'px Poppins, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(letters, cx, cy + box * 0.03);
          ctx.restore();
        }
      }

      function render(text) {
        var qr = qrcode(0, 'H');       // type 0 = auto version, ECC level H
        qr.addData(text, 'Byte');      // Byte mode -> UTF-8 via stringToBytes
        qr.make();

        var count = qr.getModuleCount();
        var total = count + QUIET * 2;
        var cell = Math.max(2, Math.floor(TARGET / total));
        var size = cell * total;

        canvas.width = size;
        canvas.height = size;

        // Background (quiet zone included)
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, size, size);

        // Modules
        ctx.fillStyle = '#000000';
        for (var r = 0; r < count; r++) {
          for (var c = 0; c < count; c++) {
            if (qr.isDark(r, c)) {
              ctx.fillRect((QUIET + c) * cell, (QUIET + r) * cell, cell, cell);
            }
          }
        }

        drawAvatar(text, size);
        result.classList.add('is-visible');
        result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var text = input.value.trim();
        if (!text) {
          inputError.classList.add('show');
          input.focus();
          return;
        }
        inputError.classList.remove('show');
        render(text);
      });

      input.addEventListener('input', function () {
        if (input.value.trim()) inputError.classList.remove('show');
        syncPreview();
      });

      downloadBtn.addEventListener('click', function () {
        var a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = 'qrcode.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      });

      buildIconPicker();
      syncPreview();
    })();
  </script>
</body>

</html>
