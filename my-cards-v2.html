<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Cards v2 - VLINKPAY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script>window.SIDEBAR_USE_CARDS_MENU = true;</script>
  <script src="global.js" defer></script>
  <link rel="stylesheet" href="global.css" />
  <style>
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: var(--shadow-z1);
      overflow: hidden;
    }

    /* Tabs Styles */
    .tabs-header {
      display: flex;
      padding: 0 24px;
      background: #fff;
      border-bottom: 1px solid var(--grey-200);
      gap: 40px;
    }

    .tab-item {
      padding: 16px 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--grey-600);
      cursor: pointer;
      position: relative;
      transition: 0.2s;
    }

    .tab-item:hover {
      color: var(--grey-900);
    }

    .tab-item.active {
      color: var(--grey-900);
    }

    .tab-item.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--grey-900);
    }

    /* My Cards v2: platform + product tabs */
    .product-tabs {
      display: flex;
      padding: 12px 24px;
      gap: 8px;
      background: #fafbfb;
      border-bottom: 1px solid var(--grey-200);
      flex-wrap: wrap;
      align-items: center;
    }

    .product-tab-item {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--grey-600);
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: 0.2s;
      white-space: nowrap;
    }

    .product-tab-item:hover {
      color: var(--grey-900);
      background: rgba(0, 0, 0, 0.04);
    }

    .product-tab-item.active {
      color: var(--primary-main);
      background: rgba(0, 167, 111, 0.1);
      border-color: rgba(0, 167, 111, 0.35);
    }

    .tab-pane {
      display: none;
    }

    .tab-pane.active {
      display: block;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
    }

    .minimal-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1400px;
    }

    #active-product-pane .minimal-table {
      min-width: 0;
    }

    #active-product-pane .table-container .minimal-table {
      min-width: var(--mcv2-tmin, 720px);
    }

    .minimal-table th {
      background: var(--grey-100);
      padding: 16px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      color: var(--grey-600);
      white-space: nowrap;
    }

    .minimal-table td {
      padding: 16px;
      border-top: 1px dashed var(--grey-200);
      font-size: 14px;
      color: var(--grey-900);
      white-space: nowrap;
    }

    .minimal-table tr:hover td {
      background: var(--grey-100);
    }

    .table-toolbar {
      padding: 24px 20px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      background: #fff;
      border-bottom: 1px dashed var(--grey-200);
    }

    .toolbar-row-mobile {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 220px;
    }

    .toolbar-row-mobile .search-field {
      min-width: 0;
    }

    .toolbar-filter-btn {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid #dfe3e8;
      background: #fff;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      color: #212b36;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      height: 40px;
    }

    .field-root {
      position: relative;
      flex-shrink: 0;
    }

    .field-label {
      position: absolute;
      top: -8px;
      left: 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--grey-600);
      background: #fff;
      padding: 0 4px;
      z-index: 2;
    }

    .field-container {
      position: relative;
      display: flex;
      align-items: center;
    }

    .field-input {
      width: 100%;
      height: 48px;
      padding: 0 12px;
      border: 1px solid var(--grey-300);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: var(--grey-900);
      outline: none;
      transition: 0.2s;
    }

    .field-input:focus {
      border-color: var(--grey-900);
    }

    /* Mobile filter modal (reuse style from product-list) */
    .mobile-filter-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1001;
    }

    .mobile-filter-overlay.open {
      display: flex;
    }

    .mobile-filter-sheet {
      background: white;
      width: 100%;
      max-width: 360px;
      border-radius: 16px;
      padding: 20px 18px 18px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 24px 48px -8px rgba(15, 23, 42, 0.25);
    }

    .mobile-filter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .mobile-filter-title {
      font-size: 16px;
      font-weight: 700;
      color: #212b36;
    }

    .mobile-filter-close {
      border: none;
      background: none;
      cursor: pointer;
      color: #637381;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mobile-filter-group {
      margin-bottom: 16px;
    }

    .mobile-filter-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #637381;
      margin-bottom: 6px;
    }

    .mobile-filter-footer {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .mobile-filter-footer button {
      flex: 1;
      height: 44px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border: none;
    }

    .btn-filter-reset {
      border: 1px solid #dfe3e8 !important;
      background: white;
      color: #212b36;
    }

    .btn-filter-apply {
      background: #00a76f;
      color: white;
    }


    .text-right {
      text-align: right !important;
    }

    .text-center {
      text-align: center !important;
    }

    @media (max-width: 767px) {
      .table-toolbar {
        flex-direction: column !important;
        align-items: stretch !important;
        padding: 12px 16px !important;
        gap: 10px !important;
      }

      .field-root {
        flex-shrink: 1 !important;
        min-width: 0 !important;
        width: 100% !important;
      }

      .table-toolbar .date-field {
        display: none;
      }


      .toolbar-row-mobile {
        flex: 1 1 auto;
        width: 100%;
      }

      .toolbar-row-mobile .field-input {
        height: 40px;
      }

      .toolbar-filter-btn {
        display: flex;
      }

      .view-mode-toggle {
        margin-left: 0;
        justify-content: flex-end;
      }

      .select-field {
        width: 100% !important;
      }
    }

    @media (min-width: 768px) and (max-width: 1023px) {
      .table-toolbar {
        flex-wrap: wrap !important;
        gap: 10px !important;
      }

      .field-root {
        flex-shrink: 1 !important;
      }
    }

    /* List / grid view toggle (all products) */
    .view-mode-toggle {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }

    .view-btn {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid var(--grey-300);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--grey-600);
      transition: 0.2s;
    }

    .view-btn:hover {
      border-color: var(--grey-600);
      color: var(--grey-900);
    }

    .view-btn.active {
      border-color: var(--primary-main);
      background: rgba(0, 167, 111, 0.08);
      color: var(--primary-main);
    }

    .cards-view-list {
      display: block;
    }

    .cards-view-grid {
      display: none;
    }

    .product-pane.view-mode-grid .cards-view-list {
      display: none;
    }

    .product-pane.view-mode-grid .cards-view-grid {
      display: block;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      padding: 24px;
    }

    .card-grid-item {
      background: #fff;
      border-radius: 16px;
      box-shadow: var(--shadow-z1);
      overflow: hidden;
      border: 1px solid var(--grey-200);
      transition: 0.2s;
    }

    .card-grid-item:hover {
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
    }

    .card-grid-item a {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card-grid-item-img {
      aspect-ratio: 1.586/1;
      background: var(--grey-100);
      position: relative;
      overflow: hidden;
    }

    .card-grid-item-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-grid-item-info {
      padding: 16px;
    }

    .card-grid-item-info .grid-merchant-name {
      font-weight: 600;
      font-size: 14px;
      color: var(--grey-900);
      margin-bottom: 4px;
    }

    .card-grid-item-info .grid-amount-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 4px;
    }

    .card-grid-item-info .grid-balance {
      font-weight: 700;
      font-size: 18px;
      color: var(--primary-main);
    }

    .card-grid-item-info .grid-amount-only {
      font-weight: 700;
      font-size: 18px;
      color: var(--primary-main);
    }

    .card-grid-item-info .grid-view-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-main);
    }

    @media (max-width: 767px) {
      .cards-grid {
        grid-template-columns: 1fr;
        padding: 16px;
      }
    }
  </style>
  <style>
    .sgc-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--grey-900);
      margin-bottom: 10px;
    }

    .sgc-qr-input {
      padding-left: 14px !important;
      padding-right: 56px !important;
    }

    .sgc-error {
      font-size: 12px;
      color: #ff5630;
      margin-top: 6px;
    }

    .sgc-card-preview {
      display: flex;
      gap: 16px;
      align-items: center;
      background: #f9fafb;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 24px;
    }

    .sgc-card-img {
      width: 110px;
      height: 70px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .sgc-card-info {
      flex: 1;
    }

    .sgc-card-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--grey-900);
      margin-bottom: 6px;
    }

    .sgc-card-balance {
      font-size: 14px;
      color: var(--grey-700, #454f5b);
    }

    .sgc-card-balance strong {
      color: var(--grey-900);
    }

    @media (max-width: 767px) {
      .sgc-card-preview {
        flex-direction: column;
        align-items: flex-start;
      }

      .sgc-card-img {
        width: 100%;
        height: 120px;
      }
    }

    /* Form Styling */
    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--grey-600);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--grey-500);
      font-size: 20px;
    }

    .input-suffix {
      position: absolute;
      right: 10px;
      z-index: 2;
      color: var(--primary-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 6px 8px;
      border-radius: 8px;
      transition: background 0.15s;
    }

    .input-suffix:hover {
      background: rgba(0, 167, 111, 0.08);
    }

    .minimal-input {
      width: 100%;
      height: 52px;
      padding: 0 14px 0 44px;
      border: 1px solid var(--grey-300);
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
      background: #fff;
    }

    .minimal-input:focus {
      border-color: var(--grey-900);
      box-shadow: 0 0 0 2px rgba(22, 28, 36, 0.05);
    }

    .btn-submit {
      width: 100%;
      height: 52px;
      background: var(--primary-main);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 8px 16px 0 rgba(0, 167, 111, 0.24);
    }

    .btn-submit:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-desktop {
      display: flex;
      align-items: center;
      justify-content: center;


      @media (max-width: 768px) {
        width: 32px;
        height: 32px;
        padding: 0;
      }
    }

    .btn-add-card-label {
      @media (max-width: 768px) {
        display: none;
      }
    }
  </style>
</head>

<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="https://staging-merchant.vlinkpay.com/assets/images/homepage/vertical-vlinkpay.svg" alt="VLinkPay" />
    </div>
    <div class="sidebar-content">
      <div class="user-card">
        <div class="avatar">
          <iconify-icon icon="solar:user-bold" width="24"></iconify-icon>
        </div>
        <div class="user-info">
          <div style="font-weight: 600; font-size: 14px; color: var(--grey-900);">Carlota Monteiro</div>
          <div style="font-size: 13px; color: var(--grey-600);">Admin</div>
        </div>
      </div>
    </div>
  </aside>

  <header class="top-header">
    <div class="header-left">
      <button class="hamburger hamburger-btn" id="hamburgerBtn"
        aria-label="Toggle menu"><span></span><span></span><span></span></button>
    </div>
    <div class="header-right">
      <div class="header-info">Jan 16, 2026 10:00:15 AM (UTC)</div>
      <div class="header-icons">
        <div class="header-icon-btn">
          <iconify-icon icon="solar:settings-bold-duotone" width="24"></iconify-icon>
        </div>
      </div>
    </div>
  </header>

  <main class="main">

    <!-- Page Header -->
    <div class="page-header page-header--between">
      <h1 class="page-title">My Cards v2</h1>
      <button class="btn-desktop btn-add-card" onclick="openModal('modal-add-card')">
        <i data-lucide="plus" style="width:20px;height:20px;"></i>
        <span class="btn-add-card-label">Add Card</span>
      </button>
    </div>

    <div class="card">
      <div class="tabs-header" id="platform-tabs"></div>
      <div class="product-tabs" id="product-tabs"></div>
      <div id="active-product-pane" class="product-pane active"></div>

      <div class="pagination">
        <div class="pagination-rows">
          <span>Rows per page:</span>
          <select class="pagination-select">
            <option>5</option>
            <option selected>10</option>
            <option>25</option>
          </select>
        </div>
        <div class="pagination-info">1-2 of 12</div>
        <div class="pagination-arrows">
          <button class="pagination-btn" disabled>
            <iconify-icon icon="eva:chevron-left-fill" width="20"></iconify-icon>
          </button>
          <button class="pagination-btn">
            <iconify-icon icon="eva:chevron-right-fill" width="20"></iconify-icon>
          </button>
        </div>
      </div>
    </div>
  </main>




  <div id="modal-add-card" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Add Card</span>
        <div class="close-btn" onclick="closeModal('modal-add-card')">
          <iconify-icon icon="eva:close-fill" width="20"></iconify-icon>
        </div>
      </div>

      <!-- Step 1: Card Number -->
      <div class="modal-body" id="ecd-step1">
        <div class="form-group" style="margin-bottom:28px">
          <label class="form-label sgc-label">
            Card Number <span style="color:#ff5630">*</span>
          </label>
          <div class="input-wrapper">
            <input type="text" class="minimal-input sgc-qr-input" id="ecdCardInput"
              placeholder="Enter card number or scan..." oninput="ecdClearError()" />
            <div class="input-suffix" onclick="ecdSimulateScan()" title="Scan QR">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary-main)">
                <path
                  d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2" />
                <rect x="7" y="7" width="3" height="3" rx="0.5" />
                <rect x="14" y="7" width="3" height="3" rx="0.5" />
                <rect x="7" y="14" width="3" height="3" rx="0.5" />
                <path d="M14 14h1M14 17h1M17 14h1M17 17h1" />
              </svg>
            </div>
          </div>
          <div id="ecdCardError" class="sgc-error" style="display:none">Please enter a card number</div>
        </div>
        <button class="btn-submit" onclick="ecdContinue()">Add</button>
      </div>


    </div>
  </div>
  <script>
    var MY_CARDS_V2_CONFIG = {

            {

    var myCardsV2State = { platformIndex: 0, productIndex: 0 };

    function slugify(s) {
      return String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    }

    function escapeHtml(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function getDetailHref(product) {
      var key = slugify(product.productName);
      if (key === 'crypto-card') return 'crypto-card-details-owner.html';
      if (key === 'membership-package') return 'issue-digital-membership-detail-owner.html';
      return '#';
    }

    function getSampleRows(platform, product) {
      var byPlat = MY_CARDS_V2_SAMPLE_DATA[platform.name];
      if (!byPlat) return [];
      var rows = byPlat[product.productName];
      return Array.isArray(rows) ? rows : [];
    }

    function formatMoney(n) {
      if (n === undefined || n === null || n === '') return '—';
      var num = Number(n);
      if (Number.isNaN(num)) return escapeHtml(String(n));
      return '$' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function statusBadgeHtml(status) {
      var map = {
        active: { label: 'Active', cls: 'status-active' },
        inactive: { label: 'Inactive', cls: 'status-inactive' },
        gifted: { label: 'Gifted', cls: 'status-completed' },
        available: { label: 'Available', cls: 'status-created' }
      };
      var m = map[status] || { label: status, cls: 'status-completed' };
      return '<span class="status-badge ' + m.cls + '">' + escapeHtml(m.label) + '</span>';
    }

    function listCellHtml(column, product, listCfg, row) {
      var actionHtml = '<a href="' + getDetailHref(product) + '" style="color: inherit;" title="View">' +
        '<iconify-icon icon="lucide:eye" style="color: var(--primary-main); cursor: pointer"></iconify-icon></a>';
      if (column === 'action') return actionHtml;
      var v = row[column];
      if (v === undefined || v === null) {
        if (column === 'giftTo') return '—';
        return '—';
      }
      switch (column) {
        case 'balance':
        case 'amount':
          return formatMoney(v);
        case 'status':
          return statusBadgeHtml(String(v));
        case 'giftTo':
          return v === '' ? '—' : escapeHtml(String(v));
        case 'cardLocked':
          return v
            ? '<span class="status-badge status-locked">Locked</span>'
            : '<span class="status-badge status-completed">Unlocked</span>';
        case 'cardLock':
          return v
            ? '<span class="status-badge status-locked">Locked</span>'
            : '<span class="status-badge status-completed">Unlocked</span>';
        case 'id':
        case 'merchantName':
        case 'createdDate':
        case 'cardNumbers':
        case 'productName':
        case 'issueBy':
        case 'currency':
        case 'expiryDate':
          return escapeHtml(String(v));
        default:
          return typeof v === 'number' ? formatMoney(v) : escapeHtml(String(v));
      }
    }

    function getGridImageSrc(product) {
      var key = slugify(product.productName);
      if (key === 'crypto-card') return 'images/cryptocard-front.png';
      if (key === 'membership-package') return 'images/membershipcard.png';
      if (key === 'gift-card') return 'images/giftcard-front.png';
      if (key === 'promotion') return 'images/promotion-front.png';
      if (key === 'discount') return 'images/discount-front.png';
      if (key === 'prepaid-card') return 'images/prepaid-front.png';
      return 'images/giftcard-front.png';
    }

    function thClassForColumn(column) {
      if (column === 'amount' || column === 'balance' || column === 'action') return ' class="text-right"';
      return '';
    }

    function tdClassForColumn(column) {
      if (column === 'amount' || column === 'balance' || column === 'action') return ' class="text-right"';
      return '';
    }

    function buildListTable(columns, product, listCfg, platform) {
      var rows = getSampleRows(platform, product);
      var tmin = Math.max(640, columns.length * 96);
      var thead = columns.map(function (col) {
        return '<th' + thClassForColumn(col) + '>' + (COLUMN_LABELS[col] || col) + '</th>';
      }).join('');
      if (!rows.length) {
        return (
          '<div class="table-container">' +
          '<table class="minimal-table" style="--mcv2-tmin:' + tmin + 'px">' +
          '<thead><tr>' + thead + '</tr></thead>' +
          '<tbody><tr><td colspan="' +
          columns.length +
          '" class="text-center" style="padding:48px;color:var(--grey-500)">No data</td></tr></tbody>' +
          '</table></div>'
        );
      }
      var tbody = rows
        .map(function (row) {
          return (
            '<tr>' +
            columns
              .map(function (col) {
                return (
                  '<td' + tdClassForColumn(col) + '>' + listCellHtml(col, product, listCfg, row) + '</td>'
                );
              })
              .join('') +
            '</tr>'
          );
        })
        .join('');
      return (
        '<div class="table-container">' +
        '<table class="minimal-table" style="--mcv2-tmin:' + tmin + 'px">' +
        '<thead><tr>' +
        thead +
        '</tr></thead><tbody>' +
        tbody +
        '</tbody></table></div>'
      );
    }

    function buildGridHtml(fields, product, platform) {
      var rows = getSampleRows(platform, product);
      var href = getDetailHref(product);
      var imgDefault = getGridImageSrc(product);
      var hasMerchant = fields.indexOf('merchantName') !== -1;
      var hasBalance = fields.indexOf('balance') !== -1;
      var hasAmount = fields.indexOf('amount') !== -1;
      var hasView = fields.indexOf('viewDetails') !== -1;
      if (!rows.length) {
        return (
          '<div class="cards-grid"><p class="text-center" style="padding:32px;color:var(--grey-500);margin:0">No data</p></div>'
        );
      }
      var items = rows
        .map(function (row) {
          var nameBlock =
            hasMerchant && row.merchantName !== undefined
              ? '<div class="grid-merchant-name">' + escapeHtml(String(row.merchantName)) + '</div>'
              : '';
          var rowInner = '';
          if (hasBalance && row.balance !== undefined) {
            rowInner += '<div class="grid-balance">' + escapeHtml(formatMoney(row.balance)) + '</div>';
          } else if (hasAmount && row.amount !== undefined) {
            rowInner += '<div class="grid-amount-only">' + escapeHtml(formatMoney(row.amount)) + '</div>';
          }
          var viewBlock = hasView
            ? '<span class="grid-view-link">View Details <iconify-icon icon="lucide:eye" width="16"></iconify-icon></span>'
            : '';
          return (
            '<div class="card-grid-item">' +
            '<a href="' +
            escapeHtml(href) +
            '">' +
            '<div class="card-grid-item-img"><img src="' +
            escapeHtml(imgDefault) +
            '" alt="" /></div>' +
            '<div class="card-grid-item-info">' +
            nameBlock +
            '<div class="grid-amount-row">' +
            rowInner +
            viewBlock +
            '</div>' +
            '</div></a></div>'
          );
        })
        .join('');
      return '<div class="cards-grid">' + items + '</div>';
    }

    function buildProductPaneHtml(platform, product) {
      var s = product.search || {};
      var vm = product.viewModes || {};
      var list = vm.list || {};
      var grid = vm.grid || {};
      var cols = list.columns || [];
      var fields = grid.fields || [];

      var toolbar = '<div class="table-toolbar">';
      if (s.enabled) {
        toolbar +=
          '<div class="toolbar-row-mobile">' +
          '<div class="search-field"><div class="field-container">' +
          '<iconify-icon icon="solar:magnifer-linear" width="20"></iconify-icon>' +
          '<input type="text" class="field-input mcv2-search-input" placeholder="' +
          escapeHtml(s.placeholder || '') +
          '" />' +
          '</div></div></div>';
      }
      toolbar +=
        '<div class="view-mode-toggle">' +
        '<button type="button" class="view-btn active" data-mcv2-view="list" title="List view">' +
        '<iconify-icon icon="solar:list-bold" width="20"></iconify-icon></button>' +
        '<button type="button" class="view-btn" data-mcv2-view="grid" title="Grid view">' +
        '<iconify-icon icon="solar:widget-5-bold" width="20"></iconify-icon></button>' +
        '</div></div>';

      var listHtml = list.enabled
        ? '<div class="cards-view-list">' + buildListTable(cols, product, list, platform) + '</div>'
        : '';
      var gridHtml = grid.enabled
        ? '<div class="cards-view-grid">' + buildGridHtml(fields, product, platform) + '</div>'
        : '';

      return toolbar + listHtml + gridHtml;
    }

    function myCardsV2RenderPlatformTabs() {
      var el = document.getElementById('platform-tabs');
      if (!el) return;
      var html = MY_CARDS_V2_CONFIG.platforms
        .map(function (p, i) {
          var active = i === myCardsV2State.platformIndex ? ' active' : '';
          return (
            '<div class="tab-item' + active + '" data-platform-index="' + i + '" role="button" tabindex="0">' +
            escapeHtml(p.name) +
            '</div>'
          );
        })
        .join('');
      el.innerHTML = html;
    }

    function myCardsV2RenderProductTabs() {
      var el = document.getElementById('product-tabs');
      if (!el) return;
      var platform = MY_CARDS_V2_CONFIG.platforms[myCardsV2State.platformIndex];
      if (!platform || !platform.products.length) {
        el.innerHTML = '';
        el.style.display = 'none';
        return;
      }
      el.style.display = 'flex';
      var html = platform.products
        .map(function (p, j) {
          var active = j === myCardsV2State.productIndex ? ' active' : '';
          return '<div class="product-tab-item' + active + '" data-product-index="' + j + '">' + escapeHtml(p.productName) + '</div>';
        })
        .join('');
      el.innerHTML = html;
    }

    function myCardsV2RenderActiveProductPane() {
      var pane = document.getElementById('active-product-pane');
      if (!pane) return;
      var platform = MY_CARDS_V2_CONFIG.platforms[myCardsV2State.platformIndex];
      var product = platform.products[myCardsV2State.productIndex];
      pane.classList.remove('view-mode-grid');
      pane.innerHTML = buildProductPaneHtml(platform, product);
      var rowCount = getSampleRows(platform, product).length;
      var pag = document.querySelector('.card .pagination-info');
      if (pag) pag.textContent = rowCount ? '1-' + rowCount + ' of ' + rowCount : '0 of 0';
      pane.querySelectorAll('[data-mcv2-view]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var mode = btn.getAttribute('data-mcv2-view');
          var listB = pane.querySelector('[data-mcv2-view="list"]');
          var gridB = pane.querySelector('[data-mcv2-view="grid"]');
          if (mode === 'list') {
            pane.classList.remove('view-mode-grid');
            if (listB) listB.classList.add('active');
            if (gridB) gridB.classList.remove('active');
          } else {
            pane.classList.add('view-mode-grid');
            if (gridB) gridB.classList.add('active');
            if (listB) listB.classList.remove('active');
          }
        });
      });
      renderLucideIcons();
    }

    function myCardsV2SelectPlatform(index) {
      myCardsV2State.platformIndex = index;
      myCardsV2State.productIndex = 0;
      myCardsV2RenderPlatformTabs();
      myCardsV2RenderProductTabs();
      myCardsV2RenderActiveProductPane();
      myCardsV2UpdateUrl();
    }

    function myCardsV2SelectProduct(index) {
      myCardsV2State.productIndex = index;
      myCardsV2RenderProductTabs();
      myCardsV2RenderActiveProductPane();
      myCardsV2UpdateUrl();
    }

    function myCardsV2UpdateUrl() {
      var plats = MY_CARDS_V2_CONFIG.platforms;
      var p = plats[myCardsV2State.platformIndex];
      var prod = p.products[myCardsV2State.productIndex];
      var url = new URL(window.location.href);
      url.searchParams.set('platform', slugify(p.name));
      url.searchParams.set('product', slugify(prod.productName));
      url.searchParams.delete('type');
      history.replaceState({}, '', url);
    }

    function myCardsV2InitFromUrl() {
      var params = new URLSearchParams(window.location.search);
      var ps = params.get('platform');
      var prs = params.get('product');
      if (!ps || !prs) return;
      var plats = MY_CARDS_V2_CONFIG.platforms;
      for (var i = 0; i < plats.length; i++) {
        if (slugify(plats[i].name) === ps) {
          myCardsV2State.platformIndex = i;
          var prods = plats[i].products;
          for (var j = 0; j < prods.length; j++) {
            if (slugify(prods[j].productName) === prs) {
              myCardsV2State.productIndex = j;
              return;
            }
          }
          myCardsV2State.productIndex = 0;
          return;
        }
      }
    }

    function myCardsV2BindPlatformTabs() {
      var el = document.getElementById('platform-tabs');
      if (!el) return;
      el.addEventListener('click', function (e) {
        var t = e.target.closest('[data-platform-index]');
        if (!t) return;
        myCardsV2SelectPlatform(parseInt(t.getAttribute('data-platform-index'), 10));
      });
    }

    function myCardsV2BindProductTabs() {
      var el = document.getElementById('product-tabs');
      if (!el) return;
      el.addEventListener('click', function (e) {
        var t = e.target.closest('[data-product-index]');
        if (!t) return;
        myCardsV2SelectProduct(parseInt(t.getAttribute('data-product-index'), 10));
      });
    }

    function closeModal(id) {
      var el = document.getElementById(id);
      if (el) el.style.display = 'none';
    }

    function openModal(id) {
      var el = document.getElementById(id);
      if (el) el.style.display = 'flex';
      renderLucideIcons();
    }

    function renderLucideIcons() {
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    }

    function ecdClearError() {
      var err = document.getElementById('ecdCardError');
      if (err) err.style.display = 'none';
    }

    function ecdSimulateScan() {
      var inp = document.getElementById('ecdCardInput');
      if (!inp) return;
      var num = Array.from({ length: 16 }, function () {
        return Math.floor(Math.random() * 10);
      }).join('');
      inp.value = num;
      ecdClearError();
    }

    function ecdContinue() {
      var inp = document.getElementById('ecdCardInput');
      if (!inp || !inp.value.trim()) {
        var err = document.getElementById('ecdCardError');
        if (err) err.style.display = 'block';
        return;
      }
      closeModal('modal-add-card');
    }

    document.addEventListener('DOMContentLoaded', function () {
      myCardsV2InitFromUrl();
      myCardsV2RenderPlatformTabs();
      myCardsV2RenderProductTabs();
      myCardsV2RenderActiveProductPane();
      myCardsV2BindPlatformTabs();
      myCardsV2BindProductTabs();
      myCardsV2UpdateUrl();
      renderLucideIcons();
    });

    window.addEventListener('load', renderLucideIcons);
    renderLucideIcons();
  </script>


</body>

</html>
