<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Ads - VLINKPAY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="global.css">
  <script src="global.js" defer></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <style>
    .ai-ads-frame-wrap {
      background: #fff;
      border-radius: 16px;
      box-shadow: var(--shadow-z1);
      overflow: hidden;
      height: calc(100vh - 220px);
      min-height: 500px;
    }

    .ai-ads-frame-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>

<body>
  <aside class="sidebar">
    <div class="sidebar-content">
      <div class="sidebar-logo">
        <img src="https://staging-merchant.vlinkpay.com/assets/images/homepage/vertical-vlinkpay.svg" alt="VLinkPay" />
      </div>
      <div class="user-card">
        <div class="avatar">
          <iconify-icon icon="solar:user-bold" width="24"></iconify-icon>
        </div>
        <div class="user-info">
          <div style="font-weight: 600; font-size: 14px; color: var(--grey-900);">Carlota Monteiro</div>
          <div style="font-size: 13px; color: var(--grey-600);">Admin</div>
        </div>
      </div>
    </div>
  </aside>

  <header class="top-header">
    <div class="header-left">
      <button class="hamburger hamburger-btn" id="hamburgerBtn"
        aria-label="Toggle menu"><span></span><span></span><span></span></button>
    </div>
    <div class="header-right">
      <div class="header-info">Jan 14, 2026 10:05:53 AM (UTC)</div>
    </div>
  </header>

  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">AI Ads</h1>
        <div class="breadcrumbs">
          <span>Marketing Tools</span>
          <span class="breadcrumbs-dot"></span>
          <span style="color: var(--grey-900); font-weight: 500;">AI Ads</span>
        </div>
      </div>
    </div>

    <div class="ai-ads-frame-wrap">
      <iframe src="ai-ads/ai-ads-embed.html" title="AI Ads Portal" allowfullscreen></iframe>
    </div>
  </main>
</body>

</html>
