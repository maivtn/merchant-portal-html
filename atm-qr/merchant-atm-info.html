<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Thông tin đối tác</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="merchant-atm-common.css" />
  <script defer src="merchant-atm-common.js"></script>
</head>

<body class="antialiased">
  <main class="screen-shell">
    <section class="partner-frame">
      <div class="px-4 pt-4 pb-3 bg-white border-b border-[rgba(217,119,6,0.08)]">
        <div class="flex items-center justify-between">
          <a href="merchant-atm-qr.html" class="inline-flex items-center gap-2 text-slate-700 text-sm font-semibold">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>Back</span>
          </a>
          <h1 class="text-[15px] font-bold text-slate-900">Thông tin đối tác</h1>
          <button class="inline-flex items-center gap-2 text-slate-700 text-sm font-semibold">
            <i data-lucide="grid-2x2" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <div class="px-5 pt-4 pb-5 bg-white">
        <div class="flex justify-end mb-3">
          <span class="inline-flex items-center rounded-full px-3 py-1 text-[11px] font-bold partner-badge">Kết nối từ QR</span>
        </div>

        <div class="flex flex-col items-center text-center">
          <div class="partner-avatar mb-4">
            <img src="../assets/icons/merchant1.png" alt="Merchant icon" />
            <span class="partner-status"></span>
          </div>

          <p class="text-sm font-semibold text-slate-700 mb-1">Merchant ATM</p>
          <h2 class="text-[26px] leading-none font-black tracking-[-0.04em] text-slate-900">MCH-8J2NIV</h2>

          <div class="mt-3 flex items-center gap-2 text-slate-600">
            <span class="inline-flex items-center gap-1.5">
              <i data-lucide="star" class="w-4 h-4 text-amber-400 fill-amber-400"></i>
              <span class="text-[13px] font-bold text-slate-800">5.0</span>
            </span>
            <span class="text-[13px] text-slate-500">(31 đánh giá)</span>
          </div>

          <div class="mt-3 space-y-2 w-full">
            <div class="flex items-center justify-center gap-2 text-slate-500">
              <i data-lucide="map-pin" class="w-4 h-4"></i>
              <span class="text-[13px] font-medium">Quận 1, TP. Hồ Chí Minh</span>
            </div>
            <div class="flex items-center justify-center gap-2 text-slate-500">
              <i data-lucide="route" class="w-4 h-4"></i>
              <span class="text-[13px] font-medium">Cách bạn 0.6 km</span>
            </div>
          </div>
        </div>

        <div class="mt-4 border-t border-slate-100 pt-4">
          <p class="text-[14px] font-bold text-slate-800 mb-3">Phương thức hỗ trợ</p>
          <div class="space-y-2.5">
            <div class="partner-support-item rounded-2xl px-3 py-3 flex items-center gap-3">
              <span class="support-icon bg-emerald-50 text-emerald-600">
                <i data-lucide="banknote" class="w-4 h-4"></i>
              </span>
              <span class="text-[14px] font-semibold text-slate-700">Cash</span>
            </div>
            <div class="partner-support-item rounded-2xl px-3 py-3 flex items-center gap-3">
              <span class="support-icon bg-orange-50 text-[color:var(--brand-primary)]">
                <i data-lucide="building-2" class="w-4 h-4"></i>
              </span>
              <span class="text-[14px] font-semibold text-slate-700">Bank Transfer</span>
            </div>
          </div>
        </div>

        <div class="mt-4 info-note rounded-2xl px-4 py-3">
          <p class="text-[13px] font-medium leading-5">
            Bạn đã quét QR từ đối tác. Hệ thống sẽ tự động kết nối tới giao dịch.
          </p>
        </div>

        <div class="mt-4 space-y-2.5">
          <a href="merchant-atm-order.html?type=buy" data-step-mode="buy" class="block w-full rounded-2xl py-3.5 text-[15px] font-bold primary-btn text-center">Mua Crypto</a>
          <a href="merchant-atm-order.html?type=sell" data-step-mode="sell" class="block w-full rounded-2xl py-3.5 text-[15px] font-bold secondary-btn text-center">Bán Crypto</a>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
