<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet Details - VLINKPAY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="global.css">
  <style>
    body {
      font-family: "Poppins", sans-serif;
      color: var(--grey-900);
      font-size: 14px;
      --bs-btn-color: #2f7df6;
      --bs-btn-border-color: #2f7df6;
      --bs-btn-hover-color: #fff;
      --bs-btn-hover-bg: #2f7df6;
      --bs-btn-hover-border-color: #2f7df6;
      --bs-btn-focus-shadow-rgb: 47, 125, 246;
      --bs-btn-active-color: #fff;
      --bs-btn-active-bg: #2f7df6;
      --bs-btn-active-border-color: #2f7df6;
      --bs-btn-active-shadow: inset 0 3px 5px rgba(0, 0, 0, 0.125);
      --bs-btn-disabled-color: #2f7df6;
      --bs-btn-disabled-bg: transparent;
      --bs-btn-disabled-border-color: #2f7df6;
    }

    @media (max-width: 767.98px) {
      body {
        font-size: 12px;
      }
    }

    .wallet-wrap {
      max-width: 1360px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .wallet-top {
      display: flex;
      align-items: center;
      gap: 24px;
      font-weight: 600;
      color: var(--grey-900);
      margin-bottom: 20px;
      font-size: 20px;
      position: relative;
    }

    @media (max-width: 768px) {
      .wallet-top {
        font-size: 16px;
      }
    }

    .wallet-top a {
      color: var(--grey-700, #4f5964);
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      transition: all .2s ease;
      font-size: 12px;
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1;
    }

    .wallet-top a:hover {
      color: var(--bs-btn-color);
    }

    .wallet-card {
      background: #fff;
      border: 1px solid #e9eef7;
      border-radius: 20px;
      box-shadow: 0 8px 28px rgba(47, 125, 246, 0.12);
      padding: 24px;
    }

    .wallet-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .wallet-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .2px;
    }

    .wallet-title img {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    .wallet-actions {
      display: flex;
      gap: 16px;
    }

    .wallet-actions .btn {
      min-width: 105px;
      font-weight: 600;
      border-radius: 8px;
      border-width: 1px;
      font-size: 14px;
    }

    @media (max-width: 767.98px) {
      .wallet-actions .btn {
        --bs-btn-padding-x: 0.35rem;
        --bs-btn-padding-y: 0.35rem;
        font-size: 12px;
      }
    }


    .summary-balance {
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.2;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .summary-balance-label {
      color: var(--grey-600);
      font-size: 14px;
      font-weight: 500;
      margin-right: 2px;
      letter-spacing: .35px;
    }

    .summary-balance-value {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .summary-value {
      color: var(--grey-700, #4f5964);
      font-size: 16px;
      margin-top: 4px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .summary-value-label {
      color: var(--grey-600);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: .35px;
    }

    @media (max-width: 767.98px) {
      .summary-balance {
        gap: 6px;
        margin-bottom: 2px;
        line-height: 1.25;
      }

      .summary-balance-label {
        font-size: 12px;
        margin-right: 0;
        letter-spacing: 0.2px;
      }

      .summary-balance-value {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.2;
      }

      .summary-value {
        font-size: 14px;
        margin-top: 2px;
        gap: 4px;
        line-height: 1.25;
      }

      .summary-value-label {
        font-size: 12px;
        letter-spacing: 0.2px;
      }
    }

    .eye-btn {
      background: #fff;
      border: none;
      color: var(--grey-700, #4f5964);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      transition: all .2s ease;
    }

    .eye-btn:hover {
      color: var(--bs-btn-color);
      border-color: rgba(2, 69, 156, 0.35);
      background: #fff;
    }

    .wallet-tabs {
      border-bottom: 1px solid #edf1f7;
      margin-bottom: 16px;
      display: flex;
      gap: 28px;
      overflow-x: auto;
      padding-bottom: 0;
    }

    .wallet-tab-btn {
      border: none;
      background: transparent;
      color: var(--grey-600);
      padding: 12px 0;
      font-weight: 600;
      white-space: nowrap;
      border-radius: 0;
      font-size: 14px;
      position: relative;
      transition: all .2s ease;
    }

    .wallet-tab-btn:hover {
      color: var(--grey-900);
    }

    .wallet-tab-btn.active {
      color: var(--grey-900);
    }

    .wallet-tab-btn.active::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 2px;
      background: var(--grey-900);
    }

    .status-pill {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px !important;
      display: inline-block;
    }

    .status-pill.success {
      color: #118d57;
      background: #e8f8f0;
    }

    .status-pill.warning {
      color: #9a6700;
      background: #fff4ce;
    }

    .btn-outline-success {
      --bs-btn-color: #2f7df6;
      --bs-btn-border-color: #2f7df6;
      --bs-btn-hover-color: #fff;
      --bs-btn-hover-bg: #2f7df6;
      --bs-btn-hover-border-color: #2f7df6;
      --bs-btn-focus-shadow-rgb: 47, 125, 246;
      --bs-btn-active-color: #fff;
      --bs-btn-active-bg: #2f7df6;
      --bs-btn-active-border-color: #2f7df6;
      --bs-btn-active-shadow: inset 0 3px 5px rgba(0, 0, 0, 0.125);
      --bs-btn-disabled-color: #2f7df6;
      --bs-btn-disabled-bg: transparent;
      --bs-btn-disabled-border-color: #2f7df6;
    }

    .view-btn {

      border: none;
      background: transparent;
      color: var(--primary-main);
      font-weight: 400 !important;
      padding: 4px 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 8px;
      white-space: nowrap;
      transition: all .2s ease;
      color: #2f7df6;
    }

    .view-btn:hover {
      background: rgba(47, 125, 246, 0.12);
    }

    .amount.increase {
      color: var(--primary-main);
      font-weight: 500;
    }

    .amount.decrease {
      color: #b42318;
      font-weight: 500;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .wallet-mobile-list {
      display: none;
    }

    .wallet-mobile-item {
      border-bottom: 1px dashed #e7edf6;
      padding: 14px 0;
    }

    .wallet-mobile-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .wallet-mobile-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }

    .wallet-mobile-left-label {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.3;
      color: var(--grey-900);
    }

    .wallet-mobile-right-value {
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
      text-align: right;
      color: var(--grey-900);
    }

    .wallet-mobile-date,
    .wallet-mobile-condition {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.45;
      color: var(--grey-600);
    }

    .wallet-mobile-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
    }

    .wallet-mobile-amount {
      font-size: 16;
      font-weight: 500;
      line-height: 1.1;
      text-align: right;
      color: var(--grey-900);
    }

    .wallet-mobile-empty {
      padding: 16px 0;
      font-size: 14px;
      color: var(--grey-600);
      text-align: center;
    }

    .table thead th {
      font-size: 12px;
      color: var(--grey-600);
      font-weight: 600;
      white-space: nowrap;
      letter-spacing: .3px;
      border-bottom: 1px solid #edf1f7;
      background: #fafcff;
      padding-top: 12px;
      padding-bottom: 12px;
    }

    .table tbody td {
      font-size: 14px;
      vertical-align: middle;
      white-space: nowrap;
      border-bottom: 1px solid #f1f4f8;
      padding-top: 14px;
      padding-bottom: 14px;
    }

    .table tbody td.money-col {
      font-weight: 600;
    }

    .table tbody tr:last-child td {
      border-bottom: none;
    }

    .table-hover>tbody>tr {
      transition: background-color .2s ease;
    }

    .table-hover>tbody>tr:hover>* {
      --bs-table-bg-state: rgba(47, 125, 246, 0.02);
    }

    .pagination-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .pagination-btn {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      border: 1px solid #dfe3e8;
      background: #fff;
      color: #637381;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 500;
      line-height: 1;
      transition: all .2s ease;
      padding: 0;
    }

    .pagination-btn:hover:not(:disabled) {
      border-color: #b5c0cc;
      color: #1c252e;
      background: #fff;
    }

    .pagination-btn:disabled {
      background: #f4f6f8;
      border-color: #dfe3e8;
      color: #9aa4af;
      cursor: not-allowed;
    }

    .pagination-btn.is-active {
      border-color: #2f7df6;
      color: #2f7df6;
      font-weight: 600;
    }

    .pagination-ellipsis {
      width: 34px;
      height: 34px;
      border: 1px solid #dfe3e8;
      border-radius: 6px;
      background: #fff;
      color: #637381;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    @media (max-width: 768px) {
      .wallet-card {
        padding: 18px;
        border-radius: 16px;
      }

      .wallet-title {
        font-size: 18px;
      }

      .wallet-tabs {
        gap: 22px;
      }



      .table-wrap {
        display: none;
      }

      .wallet-mobile-list {
        display: block;
      }


    }

    @media (max-width: 767.98px) {
      .wallet-tabs {
        gap: 12px;
        margin-bottom: 12px;
      }

      .wallet-tab-btn {
        font-size: 12px;
        padding: 8px 0;
        min-height: 36px;
      }

      .wallet-tab-btn.active::after {
        height: 2px;
      }
    }

    /* Mobile: smaller text sizes */
    .wallet-mobile-left-label {
      font-size: 12px;
    }

    .wallet-mobile-right-value {
      font-size: 12px;
    }

    .wallet-mobile-amount {
      font-size: 14px;
    }

    .wallet-mobile-date,
    .wallet-mobile-condition {
      font-size: 12px;
    }

    .wallet-mobile-condition {
      margin-top: 4px;
      font-weight: 400;
    }

    .wallet-mobile-bottom .status-pill {
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
    }

    .wallet-mobile-bottom .view-btnm {
      font-size: 12px;
      padding: 2px 0 !important;
    }

    .wallet-mobile-info-right .view-btn {
      padding: 2px 0 !important;
    }

    .wallet-mobile-bottom .view-btn span {
      font-size: 12px;
    }

    .wallet-mobile-info-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .wallet-mobile-info-left,
    .wallet-mobile-info-right {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .wallet-mobile-info-left {
      flex: 1;
      align-items: flex-start;
    }

    .wallet-mobile-info-right {
      flex-shrink: 0;
      align-items: flex-end;
    }

    .wallet-mobile-amount {
      text-align: right;
      line-height: 1.2;
    }

    .view-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .wallet-top-title {
      flex: 1;
    }

    @media screen and (min-width: 768px) {
      .wallet-top-title {
        text-align: left;
        padding-left: 90px;
      }
    }

    @media screen and (max-width: 767.98px) {
      .wallet-top-title {
        text-align: center;
      }

    }
  </style>
</head>

<body>
  <div class="wallet-wrap">
    <div class="wallet-top">
      <a href="#" id="backLink"><i class="bi bi-arrow-left"></i> Back</a>
      <span class="wallet-top-title">My Wallets</span>
    </div>

    <div class="wallet-card">
      <div class="wallet-head">
        <div class="wallet-head-left">
          <div class="wallet-title">
            <img id="walletIcon" src="images/usdv-icon.png" alt="Wallet Icon">
            <span id="walletTitle">USD VLINK</span>
          </div>
          <div class="summary-row">
            <div class="summary-balance">
              <span class="summary-balance-label">Available Balance:</span>
              <span class="summary-balance-value">
                <span id="availableBalance">0</span>
                <button class="eye-btn" id="toggleBalanceBtn" aria-label="Toggle balance visibility"><i
                    class="bi bi-eye"></i></button>
              </span>
            </div>
            <div class="summary-value">
              <span class="summary-value-label">Value:</span>
              <span id="walletValue" class="text-dark">$0</span>
            </div>
          </div>
        </div>

        <div class="wallet-actions" id="walletActions"></div>
      </div>



      <div class="wallet-tabs" id="walletTabs"></div>
      <div class="table-wrap">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr id="tableHeadRow"></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="wallet-mobile-list" id="walletMobileList"></div>
      <div class="pagination-wrap">
        <button class="pagination-btn" id="prevPageBtn" disabled>
          <i class="bi bi-chevron-left"></i>
        </button>
        <button class="pagination-btn is-active" type="button">1</button>
        <button class="pagination-btn" type="button">2</button>
        <span class="pagination-ellipsis">...</span>
        <button class="pagination-btn" type="button">17</button>
        <button class="pagination-btn" id="nextPageBtn">
          <i class="bi bi-chevron-right"></i>
        </button>
      </div>
    </div>
  </div>

  <script src="wallet.js"></script>
  <script>
    (function () {
      "use strict";

      const config = window.MY_WALLETS_CONFIG || {};
      const wallets = Array.isArray(config.wallets) ? config.wallets : [];
      const params = new URLSearchParams(window.location.search);
      const walletName = (params.get("name") || "").toUpperCase();
      const wallet = wallets.find(function (item) {
        return (item.code || "").toUpperCase() === walletName;
      }) || wallets[0];

      if (!wallet) {
        return;
      }

      const summary = Array.isArray(wallet.summary) ? wallet.summary : [];
      const available = summary.find(function (s) { return s.key === "availableBalance"; }) || {};
      const value = summary.find(function (s) { return s.key === "value"; }) || {};
      const views = Array.isArray(wallet.views) ? wallet.views : [];
      let activeView = views.find(function (v) { return v.defaultActive; }) || views[0];
      let showBalance = true;

      const walletTitleEl = document.getElementById("walletTitle");
      const walletIconEl = document.getElementById("walletIcon");
      const availableBalanceEl = document.getElementById("availableBalance");
      const walletValueEl = document.getElementById("walletValue");
      const walletActionsEl = document.getElementById("walletActions");
      const walletTabsEl = document.getElementById("walletTabs");
      const tableHeadRowEl = document.getElementById("tableHeadRow");
      const tableBodyEl = document.getElementById("tableBody");
      const walletMobileListEl = document.getElementById("walletMobileList");
      const toggleBalanceBtn = document.getElementById("toggleBalanceBtn");

      walletTitleEl.textContent = wallet.name || wallet.code || "Wallet";
      walletIconEl.src = wallet.icon;
      walletIconEl.alt = wallet.name || "Wallet icon";
      availableBalanceEl.textContent = available.display || "0";
      walletValueEl.textContent = value.display || "$0";

      const actions = Array.isArray(wallet.actions) ? wallet.actions : [];
      function getActionIconClass(label) {
        const text = String(label || "").toLowerCase();
        if (text.indexOf("receive") !== -1) return "bi-box-arrow-in-down";
        if (text.indexOf("send") !== -1) return "bi-box-arrow-up";
        return "bi-plus-circle";
      }
      walletActionsEl.innerHTML = actions.map(function (action) {
        const label = action.label || "Action";
        return '<button type="button" class="btn btn-outline-success"><i class="bi ' + getActionIconClass(label) + ' me-1"></i>' + label + "</button>";
      }).join("");

      function statusClass(status) {
        const tone = status && status.tone ? status.tone : "";
        if (tone === "success") return "success";
        if (tone === "warning") return "warning";
        return "success";
      }

      function isMoneyColumn(columnKey) {
        const key = String(columnKey || "").toLowerCase();
        return ["amount", "value", "balance", "fee", "total", "price"].some(function (token) {
          return key.indexOf(token) !== -1;
        });
      }

      function isRightAlignedColumn(columnKey) {
        const key = String(columnKey || "").toLowerCase();
        return isMoneyColumn(columnKey) || key === "action";
      }

      function buildCell(columnKey, row) {
        const valueCell = row[columnKey];
        if (columnKey === "status" && valueCell && typeof valueCell === "object") {
          return '<span class="status-pill ' + statusClass(valueCell) + '">' + (valueCell.label || "Done") + "</span>";
        }
        if (columnKey === "action" && valueCell && typeof valueCell === "object") {
          return '<button type="button" class="view-btn" aria-label="' + (valueCell.label || "View") + '" title="' + (valueCell.label || "View") + '"><i class="bi bi-eye"></i><span>View</span></button>';
        }
        if (valueCell && typeof valueCell === "object" && valueCell.display) {
          const amountClass = columnKey === "amount" ? "amount " + (valueCell.trend || "") : "";
          return '<span class="' + amountClass.trim() + '">' + valueCell.display + "</span>";
        }
        return valueCell == null ? "" : String(valueCell);
      }

      function escapeHtml(text) {
        return String(text == null ? "" : text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function getDisplayValue(valueCell) {
        if (valueCell && typeof valueCell === "object" && valueCell.display) {
          return valueCell.display;
        }
        return valueCell == null ? "" : String(valueCell);
      }

      function renderMobileRow(viewKey, row) {
        const typeText = escapeHtml(getDisplayValue(row.type) || "-");
        const amountRaw = row.amount;
        const amountText = escapeHtml(getDisplayValue(amountRaw) || "-");
        const amountClass = amountRaw && typeof amountRaw === "object" && amountRaw.trend
          ? "amount " + escapeHtml(amountRaw.trend)
          : "";

        if (viewKey === "bonusHoldings") {
          const status = row.status && typeof row.status === "object"
            ? '<span class="status-pill ' + statusClass(row.status) + '">' + escapeHtml(row.status.label || "Holding") + "</span>"
            : '<span class="status-pill warning">Holding</span>';
          const condition = escapeHtml(getDisplayValue(row.conditionToUnlock) || "-");

          return '<article class="wallet-mobile-item">'
            + '<div class="wallet-mobile-top">'
            + '<div class="wallet-mobile-left-label">Type</div>'
            + '<div class="wallet-mobile-right-value">' + typeText + "</div>"
            + "</div>"
            + '<div class="wallet-mobile-bottom">'
            + status
            + '<div class="wallet-mobile-amount">' + amountText + "</div>"
            + "</div>"
            + '<div class="wallet-mobile-condition">' + condition + "</div>"
            + "</article>";
        }

        const dateText = escapeHtml(getDisplayValue(row.dateTime) || "-");
        const status = row.status && typeof row.status === "object"
          ? '<span class="status-pill ' + statusClass(row.status) + '">' + escapeHtml(row.status.label || "Completed") + "</span>"
          : '<span class="status-pill success">Completed</span>';
        const actionLabel = row.action && typeof row.action === "object" ? (row.action.label || "View Details") : "View Details";

        return '<article class="wallet-mobile-item">'
          + '<div class="wallet-mobile-top">'
          + '<div class="wallet-mobile-left-label">Type</div>'
          + '<div class="wallet-mobile-right-value">' + typeText + '</div>'
          + '</div>'
          + '<div class="wallet-mobile-info-row">'
          + '<div class="wallet-mobile-info-left">'
          + '<div class="wallet-mobile-date">' + dateText + '</div>'
          + status
          + '</div>'
          + '<div class="wallet-mobile-info-right">'
          + '<div class="wallet-mobile-amount"><span class="' + amountClass + '">' + amountText + '</span></div>'
          + '<button type="button" class="view-btn" aria-label="' + escapeHtml(actionLabel) + '" title="' + escapeHtml(actionLabel) + '">'
          + '<i class="bi bi-eye"></i><span>View Details</span>'
          + '</button>'
          + '</div>'
          + '</div>'
          + '</article>';
      }

      function renderTable(view) {
        if (!view || !view.table) {
          tableHeadRowEl.innerHTML = "";
          tableBodyEl.innerHTML = "";
          return;
        }
        const columns = Array.isArray(view.table.columns) ? view.table.columns : [];
        const rows = Array.isArray(view.table.rows) ? view.table.rows : [];

        tableHeadRowEl.innerHTML = columns.map(function (col) {
          const alignClass = isRightAlignedColumn(col.key) ? "text-end money-col" : "";
          return '<th class="' + alignClass + '">' + (col.label || "") + "</th>";
        }).join("");

        tableBodyEl.innerHTML = rows.map(function (row) {
          const tds = columns.map(function (col) {
            const alignClass = isRightAlignedColumn(col.key) ? "text-end money-col" : "";
            return '<td class="' + alignClass + '">' + buildCell(col.key, row) + "</td>";
          }).join("");
          return "<tr>" + tds + "</tr>";
        }).join("");
      }

      function renderMobileList(view) {
        if (!view || !view.table) {
          walletMobileListEl.innerHTML = "";
          return;
        }
        const rows = Array.isArray(view.table.rows) ? view.table.rows : [];
        if (!rows.length) {
          walletMobileListEl.innerHTML = '<div class="wallet-mobile-empty">No data available</div>';
          return;
        }
        walletMobileListEl.innerHTML = rows.map(function (row) {
          return renderMobileRow(view.key, row);
        }).join("");
      }

      function renderTabs() {
        walletTabsEl.innerHTML = views.map(function (view) {
          const activeClass = activeView && view.key === activeView.key ? "active" : "";
          return '<button type="button" class="wallet-tab-btn ' + activeClass + '" data-view-key="' + view.key + '">' + (view.label || view.key) + "</button>";
        }).join("");
      }

      walletTabsEl.addEventListener("click", function (event) {
        const btn = event.target.closest(".wallet-tab-btn");
        if (!btn) return;
        const key = btn.getAttribute("data-view-key");
        const nextView = views.find(function (v) { return v.key === key; });
        if (!nextView) return;
        activeView = nextView;
        renderTabs();
        renderTable(activeView);
        renderMobileList(activeView);
      });

      toggleBalanceBtn.addEventListener("click", function () {
        showBalance = !showBalance;
        if (showBalance) {
          availableBalanceEl.textContent = available.display || "0";
          walletValueEl.textContent = value.display || "$0";
          toggleBalanceBtn.innerHTML = '<i class="bi bi-eye"></i>';
        } else {
          availableBalanceEl.textContent = "••••••";
          walletValueEl.textContent = "••••••";
          toggleBalanceBtn.innerHTML = '<i class="bi bi-eye-slash"></i>';
        }
      });

      renderTabs();
      renderTable(activeView);
      renderMobileList(activeView);
    })();
  </script>
</body>

</html>
