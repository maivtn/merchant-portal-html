<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .action-bar {
            background-color: #fff;
            display: flex;
            gap: 8px;
            align-items: center;
            width: 100%;
            max-width: 900px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .button-item {
            display: flex;
            flex: 1 0 0;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            min-height: 1px;
            min-width: 1px;
            transition: opacity 0.3s;
            cursor: pointer;
        }

        .button-item:hover {
            opacity: 0.8;
        }

        .button-icon {
            position: relative;
            border-radius: 16px;
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .button-label {
            flex: 1 0 0;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            line-height: 15px;
            min-height: 1px;
            min-width: 1px;
            font-style: normal;
            color: #6a7282;
            font-size: 11px;
            text-align: center;
        }

        .button-item--sms .button-icon {
            box-shadow: 0px 4px 6px 0px #ede9fe, 0px 2px 4px 0px #ede9fe;
            background-image: linear-gradient(135deg, #ede9fe 0%, #f5f3ff 100%);
        }

        .button-item--email .button-icon {
            box-shadow: 0px 4px 6px 0px #dff2fe, 0px 2px 4px 0px #dff2fe;
            background-image: linear-gradient(135deg, #dff2fe 0%, #f0f9ff 100%);
        }

        .button-item--print .button-icon {
            box-shadow: 0px 4px 6px 0px #fef3c6, 0px 2px 4px 0px #fef3c6;
            background-image: linear-gradient(135deg, #fef3c6 0%, #fffbeb 100%);
        }

        .button-item--download .button-icon {
            box-shadow: 0px 4px 6px 0px #d0fae5, 0px 2px 4px 0px #d0fae5;
            background-image: linear-gradient(135deg, #d0fae5 0%, #ecfdf5 100%);
        }

        .button-item--reload .button-icon {
            box-shadow: 0px 4px 6px 0px #dbeafe, 0px 2px 4px 0px #dbeafe;
            background-image: linear-gradient(135deg, #dbeafe 0%, #eef2ff 100%);
        }

        .button-item--edit .button-icon {
            box-shadow: 0px 4px 6px 0px #e0e7ff, 0px 2px 4px 0px #e0e7ff;
            background-image: linear-gradient(135deg, #e0e7ff 0%, #eff6ff 100%);
        }

        .button-item--withdraw .button-icon {
            box-shadow: 0px 4px 6px 0px #cbfbf1, 0px 2px 4px 0px #cbfbf1;
            background-image: linear-gradient(135deg, #cbfbf1 0%, #ecfdf5 100%);
        }

        .button-item--qr .button-icon {
            box-shadow: 0px 4px 6px 0px #fae8ff, 0px 2px 4px 0px #fae8ff;
            background-image: linear-gradient(135deg, #fae8ff 0%, #fdf2f8 100%);
        }
    </style>
</head>
