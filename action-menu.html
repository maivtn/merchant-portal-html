<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /*  */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        .action-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .action-bar__item {
            display: flex;
            flex: 1 1 0;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            min-width: 0;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
            transition: opacity 0.25s ease;
        }

        .action-bar__item:hover {
            opacity: 0.85;
        }

        .action-bar__icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 16px;
            flex-shrink: 0;
        }

        .action-bar__icon svg {
            width: 20px;
            height: 20px;
            display: block;
        }

        .action-bar__label {
            color: #6a7282;
            font-size: 11px;
            font-weight: 500;
            line-height: 1.35;
            text-align: center;
        }

        .action-bar__item--sms {
            color: #7f22fe;
        }

        .action-bar__item--sms .action-bar__icon {
            background: linear-gradient(135deg, #ede9fe 0%, #f5f3ff 100%);
            box-shadow: 0 4px 6px #ede9fe, 0 2px 4px #ede9fe;
        }

        .action-bar__item--email {
            color: #0084d1;
        }

        .action-bar__item--email .action-bar__icon {
            background: linear-gradient(135deg, #dff2fe 0%, #f0f9ff 100%);
            box-shadow: 0 4px 6px #dff2fe, 0 2px 4px #dff2fe;
        }

        .action-bar__item--print {
            color: #e17100;
        }

        .action-bar__item--print .action-bar__icon {
            background: linear-gradient(135deg, #fef3c6 0%, #fffbeb 100%);
            box-shadow: 0 4px 6px #fef3c6, 0 2px 4px #fef3c6;
        }

        .action-bar__item--download {
            color: #009966;
        }

        .action-bar__item--download .action-bar__icon {
            background: linear-gradient(135deg, #d0fae5 0%, #ecfdf5 100%);
            box-shadow: 0 4px 6px #d0fae5, 0 2px 4px #d0fae5;
        }

        .action-bar__item--reload,
        .action-bar__item--swap {
            color: #155dfc;
        }

        .action-bar__item--reload .action-bar__icon,
        .action-bar__item--swap .action-bar__icon {
            background: linear-gradient(135deg, #dbeafe 0%, #eef2ff 100%);
            box-shadow: 0 4px 6px #dbeafe, 0 2px 4px #dbeafe;
        }

        .action-bar__item--edit {
            color: #4f39f6;
        }

        .action-bar__item--edit .action-bar__icon {
            background: linear-gradient(135deg, #e0e7ff 0%, #eff6ff 100%);
            box-shadow: 0 4px 6px #e0e7ff, 0 2px 4px #e0e7ff;
        }

        .action-bar__item--withdraw {
            color: #009689;
        }

        .action-bar__item--withdraw .action-bar__icon {
            background: linear-gradient(135deg, #cbfbf1 0%, #ecfdf5 100%);
            box-shadow: 0 4px 6px #cbfbf1, 0 2px 4px #cbfbf1;
        }

        .action-bar__item--qr {
            color: #c800de;
        }

        .action-bar__item--qr .action-bar__icon {
            background: linear-gradient(135deg, #fae8ff 0%, #fdf2f8 100%);
            box-shadow: 0 4px 6px #fae8ff, 0 2px 4px #fae8ff;
        }

        .action-bar__item--sms:hover .action-bar__icon {
            box-shadow: 0 8px 16px rgba(127, 34, 254, 0.18);
        }

        .action-bar__item--email:hover .action-bar__icon {
            box-shadow: 0 8px 16px rgba(0, 132, 209, 0.18);
        }

        .action-bar__item--print:hover .action-bar__icon {
            box-shadow: 0 8px 16px rgba(225, 113, 0, 0.18);
        }

        .action-bar__item--download:hover .action-bar__icon {
            box-shadow: 0 8px 16px rgba(0, 153, 102, 0.18);
        }

        .action-bar__item--reload:hover .action-bar__icon,
        .action-bar__item--swap:hover .action-bar__icon {
            box-shadow: 0 8px 16px rgba(21, 93, 252, 0.18);
        }

        .action-bar__item--edit:hover .action-bar__icon {
            box-shadow: 0 8px 16px rgba(79, 57, 246, 0.18);
        }

        .action-bar__item--withdraw:hover .action-bar__icon {
            box-shadow: 0 8px 16px rgba(0, 150, 137, 0.18);
        }

        .action-bar__item--qr:hover .action-bar__icon {
            box-shadow: 0 8px 16px rgba(200, 0, 222, 0.18);
        }

        @media (max-width: 768px) {
            .action-bar {
                flex-wrap: wrap;
                justify-content: center;
                padding: 16px;
            }

            .action-bar__item {
                flex: 0 0 calc(25% - 8px);
            }
        }

        @media (max-width: 480px) {
            .action-bar {
                gap: 12px 8px;
            }

            .action-bar__item {
                flex: 0 0 calc(33.333% - 6px);
            }

            .action-bar__icon {
                width: 44px;
                height: 44px;
                border-radius: 14px;
            }

            .action-bar__label {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="action-bar">
        <button class="action-bar__item action-bar__item--sms" type="button">
            <span class="action-bar__icon">
                <img src="assets/icons/actions/sms.svg" alt="Send SMS" />
            </span>
            <span class="action-bar__label">Send SMS</span>
        </button>

        <button class="action-bar__item action-bar__item--email" type="button">
            <span class="action-bar__icon">
                <img src="assets/icons/actions/email.svg" alt="Send Email" />
            </span>
            <span class="action-bar__label">Send Email</span>
        </button>

        <button class="action-bar__item action-bar__item--print" type="button">
            <span class="action-bar__icon">
                <img src="assets/icons/actions/print.svg" alt="Print" />
            </span>
            <span class="action-bar__label">Print</span>
        </button>

        <button class="action-bar__item action-bar__item--download" type="button">
            <span class="action-bar__icon">
                <img src="assets/icons/actions/download.svg" alt="Download" />
            </span>
            <span class="action-bar__label">Download</span>
        </button>

        <button class="action-bar__item action-bar__item--reload" type="button">
            <span class="action-bar__icon">
                <img src="assets/icons/actions/reload.svg" alt="Reload" />
            </span>
            <span class="action-bar__label">Reload</span>
        </button>

        <button class="action-bar__item action-bar__item--swap" type="button">
            <span class="action-bar__icon">
                <img src="assets/icons/actions/swap.svg" alt="Swap" />
            </span>
            <span class="action-bar__label">Swap</span>
        </button>

        <button class="action-bar__item action-bar__item--edit" type="button">
            <span class="action-bar__icon">
                <img src="assets/icons/actions/edit.svg" alt="Edit" />
            </span>
            <span class="action-bar__label">Edit</span>
        </button>

        <button class="action-bar__item action-bar__item--withdraw" type="button">
            <span class="action-bar__icon">
                <img src="assets/icons/actions/withdraw.svg" alt="Withdraw" />
            </span>
            <span class="action-bar__label">Withdraw</span>
        </button>

        <button class="action-bar__item action-bar__item--qr" type="button">
            <span class="action-bar__icon">
                <img src="assets/icons/actions/qrcode.svg" alt="View QR" />
            </span>
            <span class="action-bar__label">View QR</span>
        </button>
        <button class="action-bar__item action-bar__item--remove" type="button">
            <span class="action-bar__icon">
                <img src="assets/icons/actions/remove.svg" alt="Remove" />
            </span>
            <span class="action-bar__label">Remove</span>
        </button>
    </div>
</body>

</html>
