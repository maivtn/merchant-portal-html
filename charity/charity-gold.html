<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gift Charity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] },
                    colors: {
                        gold: '#d97706',
                        gold2: '#fef3c7',
                        panel: '#ffffff',
                        line: '#e0e0e0',
                        base: '#fffdf9',
                        soft: '#757575',
                        cream: '#221f1f'
                    },
                    boxShadow: {
                        luxury: '0 14px 32px rgba(34, 31, 31, 0.08)',
                        gold: '0 14px 28px rgba(217, 119, 6, 0.12)'
                    },
                    keyframes: {
                        fadeUp: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    },
                    animation: {
                        fadeUp: 'fadeUp .35s ease-out'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="./charity-gold.css" />
</head>

<body class="bg-base text-cream font-sans min-h-screen selection:bg-gold selection:text-black">
    <template id="tpl-buy-shell">
        <div id="buy-view" class="space-y-6 sm:space-y-8">
            <div id="buy-step-type"></div>
            <div id="buy-step-details"></div>
            <div id="buy-step-payment"></div>
        </div>
    </template>
    <template id="tpl-panel">
        <section {{idAttr}}
            class="overflow-hidden rounded-2xl border border-line bg-panel shadow-luxury animate-fadeUp">
            <div
                class="flex items-center gap-3 border-b border-line bg-black/30 px-4 py-3 sm:gap-4 sm:px-5 sm:py-4 sm:px-6">
                <div
                    class="grid h-7 w-7 place-items-center rounded-full border border-gold text-xs font-bold text-gold sm:h-8 sm:w-8">
                    {{step}}</div>
                <h3 class="text-xs font-bold uppercase tracking-[0.2em] text-gold">{{title}}</h3>
            </div>
            <div class="p-4 sm:p-5 sm:p-6">{{body}}</div>
        </section>
    </template>
    <template id="tpl-gift-type">
        <p class="mb-4 text-[13px] text-zinc-300 sm:mb-5 sm:text-sm">Choose how you want to share your contribution</p>
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 sm:gap-5"><button data-action="set-flow" data-flow="voucher"
                class="rounded-2xl border p-4 text-left transition sm:p-2 {{voucherClass}}">
                <div class="flex items-center gap-3 sm:gap-4">
                    <div class="grid h-10 w-10 place-items-center rounded-xl sm:h-12 sm:w-12 {{voucherIconClass}}">
                        {{voucherIcon}}</div>
                    <div>
                        <h3 class="mb-0.5 text-sm font-semibold text-cream sm:mb-1 sm:text-[15px]">Charity E-Voucher
                        </h3>
                        <p class="text-xs leading-relaxed text-soft sm:text-[13px]">Donate directly to a cause and share
                            the impact.</p>
                    </div>
                </div>
            </button><button data-action="set-flow" data-flow="card"
                class="rounded-2xl border p-4 text-left transition sm:p-2 {{cardClass}}">
                <div class="flex items-center gap-3 sm:gap-4">
                    <div class="grid h-10 w-10 place-items-center rounded-xl sm:h-12 sm:w-12 {{cardIconClass}}">
                        {{cardIcon}}</div>
                    <div>
                        <h3 class="mb-0.5 text-sm font-semibold text-cream sm:mb-1 sm:text-[15px]">Charity E-Gift Card
                        </h3>
                        <p class="text-xs leading-relaxed text-soft sm:text-[13px]">Buy a gift card that lets the
                            recipient choose.</p>
                    </div>
                </div>
            </button></div>
    </template>
    <template id="tpl-voucher-details">
        <div class="space-y-6 sm:space-y-8">
            <div>
                <h4 class="mb-3 text-xs font-bold uppercase tracking-[0.18em] text-cream sm:mb-4">Select Purpose</h4>
                <div id="purpose-grid" class="grid grid-cols-2 gap-3 sm:grid-cols-3 sm:gap-4"></div>
            </div>
            <div>
                <h4 class="mb-3 text-xs font-bold uppercase tracking-[0.18em] text-cream sm:mb-4">Select Currency &
                    Amount</h4>
                <div class="flex gap-3 sm:gap-4">
                    <div class="relative"><select id="currency-select"
                            class="h-12 w-28 appearance-none rounded-lg border border-line bg-black/30 pl-4 pr-10 text-sm font-semibold text-gold outline-none transition focus:border-gold sm:h-14">
                            <option value="USD">USD</option>
                            <option value="VND">VND</option>
                        </select><span
                            class="pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-soft">{{currencyIcon}}</span>
                    </div><input id="amount-input" type="text" placeholder="0.00"
                        class="h-12 w-full min-w-0 rounded-lg border border-line bg-black/30 px-4 text-sm font-semibold text-cream outline-none transition placeholder:text-zinc-500 focus:border-gold sm:h-14 sm:px-5 sm:flex-1 sm:text-base-1">
                </div>
            </div>
        </div>
    </template>
    <template id="tpl-card-details">
        <div class="space-y-6 sm:space-y-8">
            <div>
                <h4 class="mb-3 text-xs font-bold uppercase tracking-[0.18em] text-cream sm:mb-4">Select Currency &
                    Value</h4>
                <div class="flex gap-3 sm:gap-4">
                    <div class="relative"><select id="currency-select"
                            class="h-12 w-28 appearance-none rounded-lg border border-line bg-black/30 pl-4 pr-10 text-sm font-semibold text-gold outline-none transition focus:border-gold sm:h-14">
                            <option value="USD">USD</option>
                            <option value="VND">VND</option>
                        </select><span
                            class="pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-soft">{{currencyIcon}}</span>
                    </div><input id="card-value-input" type="text" placeholder="Enter value"
                        class="h-12 w-full min-w-0 rounded-lg border border-line bg-black/30 px-4 text-sm font-semibold text-cream outline-none transition placeholder:text-zinc-500 focus:border-gold sm:h-14 sm:px-5 sm:flex-1 sm:text-base-1">
                </div>
            </div>
            <div class="rounded-2xl border border-line bg-black/20 p-3 sm:p-4">
                <div class="flex items-center justify-between">
                    <h4 class="text-[11px] font-bold uppercase tracking-[0.18em] text-zinc-300">Quantity</h4>
                    <div class="flex items-center gap-3 rounded-lg border border-line bg-panel p-1 sm:gap-4"><button
                            data-action="quantity-minus"
                            class="grid h-7 w-7 place-items-center rounded text-soft transition hover:bg-zinc-900 hover:text-gold sm:h-8 sm:w-8">{{minusIcon}}</button><span
                            id="quantity-value" class="w-6 text-center font-semibold text-cream">1</span><button
                            data-action="quantity-plus"
                            class="grid h-7 w-7 place-items-center rounded text-gold transition hover:bg-gold/10 sm:h-8 sm:w-8">{{plusIcon}}</button>
                    </div>
                </div>
            </div>
            <div class="space-y-3 sm:space-y-4"><label class="flex cursor-pointer items-center gap-3 sm:gap-4"><input
                        id="send-directly-check" type="checkbox"
                        class="h-5 w-5 rounded-[4px] border border-zinc-600 bg-black/30 accent-[#d97706] transition focus:ring-0"><span
                        class="text-sm text-cream sm:text-[15px]">Send directly to a recipient</span></label>
                <div id="recipient-fields" class="hidden space-y-3 sm:space-y-4"><input id="recipient-name-input"
                        type="text" placeholder="Recipient Name (Optional)"
                        class="h-11 w-full rounded-lg border border-line bg-black/30 px-4 text-sm text-cream outline-none placeholder:text-zinc-500 focus:border-gold sm:h-12"><input
                        id="recipient-email-input" type="email" placeholder="Recipient Email *"
                        class="h-11 w-full rounded-lg border border-line bg-black/30 px-4 text-sm text-cream outline-none placeholder:text-zinc-500 focus:border-gold sm:h-12">
                </div>
            </div>
        </div>
    </template>
    <template id="tpl-payment">
        <div class="space-y-6 sm:space-y-8">
            <div>
                <h4 class="mb-3 text-xs font-bold uppercase tracking-[0.18em] text-cream sm:mb-4">Payment Method</h4>
                <div id="payment-list" class="space-y-3"></div>
            </div>
            <div class="rounded-2xl border border-line bg-black/20 p-4 sm:p-6">
                <div class="mb-4 flex items-center gap-3 text-gold sm:mb-5">{{shieldIcon}}<h4
                        class="text-[11px] font-bold uppercase tracking-[0.2em] text-gold sm:text-[13px]">Invoice
                        Summary</h4>
                </div>
                <div id="invoice-summary"></div>
            </div><button id="confirm-payment-btn" data-action="confirm-payment"
                class="btn-action mx-auto block rounded-lg px-12 py-3 text-[13px] font-extrabold uppercase tracking-[0.16em] sm:py-3.5 sm:text-[15px]"></button>
        </div>
    </template>
    <template id="tpl-qr-view">
        <div class="mx-auto max-w-[420px] animate-fadeUp">
            <div class="rounded-2xl border border-line bg-panel p-3 shadow-luxury sm:p-6">
                <div class="rounded-[22px] border border-line bg-black/90 p-4 text-center text-[#f4ead8] sm:p-6">
                    <p class="text-[12px] font-semibold uppercase tracking-[0.34em] text-zinc-400 sm:text-[13px]">
                        CHARITY E-GIFT CARD</p>
                    <div class="mt-4 flex items-end justify-center gap-3 sm:mt-5"><span
                            class="text-5xl font-semibold leading-none text-gold sm:text-6xl">{{amount}}</span><span
                            class="pb-1 text-lg font-semibold tracking-[0.18em] text-gold sm:text-2xl">{{currency}}</span>
                    </div>
                    <div class="my-5 border-t border-dashed border-white/10 sm:my-6"></div>
                    <div
                        class="mx-auto w-full max-w-[240px] rounded-[18px] border-2 border-gold bg-white p-2.5 shadow-[0_10px_24px_rgba(0,0,0,0.28)] sm:max-w-[260px] sm:p-3">
                        <img src="{{qrSrc}}" alt="QR code" class="block h-auto w-full rounded-[12px] bg-white"></div>
                    <p
                        class="mt-4 text-[11px] font-extrabold uppercase tracking-[0.26em] text-gold sm:mt-5 sm:text-[13px]">
                        REDEEM CODE</p>
                    <div
                        class="mx-auto mt-2.5 max-w-[320px] rounded-xl border border-white/10 bg-black/70 px-5 py-3 text-center text-[18px] font-semibold tracking-[0.32em] text-[#f4ead8] sm:mt-3 sm:py-4 sm:text-[20px]">
                        {{redeemCode}}</div>
                    <p
                        class="mt-4 text-[11px] font-semibold uppercase tracking-[0.22em] text-zinc-500 sm:mt-5 sm:text-[12px]">
                        FROM VLINKPAY FOUNDATION</p>
                    <div class="mt-6 sm:mt-8"><button data-action="download-receipt"
                            class="btn-action-outline w-full py-3 text-[11px] font-extrabold uppercase tracking-[0.16em] sm:py-3.5 sm:text-[13px]">DOWNLOAD
                            QR</button></div>
                </div>
            </div>
        </div>
    </template>
    <template id="tpl-proof-view">
        <div class="mx-auto max-w-3xl animate-fadeUp">
            <div class="rounded-2xl border border-line bg-panel p-6 shadow-luxury sm:p-8">
                <h3 class="mb-4 text-lg font-semibold text-gold">Uploaded Proof</h3>
                <div
                    class="grid h-[420px] place-items-center rounded-2xl border border-dashed border-gold/30 bg-black/30 text-soft">
                    Proof image / file preview placeholder</div>
            </div>
        </div>
    </template>
    <template id="tpl-modal">
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4">
            <div class="w-full max-w-md rounded-2xl border border-gold/20 bg-panel p-6 text-center shadow-luxury">
                <div class="mx-auto mb-4 grid h-14 w-14 place-items-center rounded-full bg-[#fef3c7] text-[#92400e]">
                    {{checkIcon}}</div>
                <h3 class="mb-2 text-xl font-semibold text-cream">Payment Successful</h3>
                <p class="mb-6 text-sm text-soft">Your transaction was completed successfully.</p>
                <div class="flex gap-3"><button data-action="close-success"
                        class="btn-action-secondary flex-1 px-4 py-3 text-[11px] font-extrabold tracking-[0.14em] sm:text-[13px]">Close</button><button
                        data-action="view-after-success"
                        class="btn-action flex-1 px-4 py-3 text-[11px] font-extrabold tracking-[0.14em] sm:text-[13px]">View
                        {{viewLabel}}</button></div>
            </div>
        </div>
    </template>
    <div id="app" class="relative z-10"></div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="./charity-gold.js"></script>
</body>

</html>
